name: Publish v0.13.0-alpha12 prerelease

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-alpha12-prerelease.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
      TAG: v0.13.0-alpha12
      APK_NAME: Amaral-Driver-Lab-v0.13.0-alpha12.apk
      SHA_NAME: Amaral-Driver-Lab-v0.13.0-alpha12.sha256
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Native toolchain
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest :telemetry-sdk:testDebugUnitTest --stacktrace --console=plain

      - name: Build prerelease APK
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/${APK_NAME}"
          (
            cd release
            sha256sum "${APK_NAME}" > "${SHA_NAME}"
          )

      - name: Publish GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          NOTES=$(cat <<'EOF'
          ## Amaral Driver Lab v0.13.0-alpha12

          This prerelease fixes the result-language issue reported in #33.

          ### Result and log language
          - Portuguese app locales (`pt-BR`, `pt-PT`, and other `pt` variants) keep Portuguese result text;
          - every non-Portuguese app locale now generates result text in English;
          - the rule applies to the Recommended Full result preview, detailed Full log, HTML report, GitHub issue title and Markdown body;
          - regular workload issue reports follow the same language policy;
          - emulator-log reports remain in English for non-Portuguese locales.

          ### Contract safety
          - JSON field names, enum values, IDs, hashes, metrics, and embedded technical JSON are not translated;
          - historical Full profiles and ranking comparability are unchanged;
          - no benchmark weights, workloads, or scoring thresholds changed in this release.

          ### Validation
          - language-policy unit tests cover `pt-BR`, `pt-PT`, English, Spanish, and German;
          - Android and telemetry unit tests executed in GitHub Actions;
          - Vulkan shaders, native C++, and the arm64 debug APK built in GitHub Actions;
          - APK SHA-256 generated and verified against the uploaded release asset.

          The separate Advanced Full crash mentioned in #33 did not include a stack trace or diagnostic bundle and remains under investigation pending reproducible evidence.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Amaral Driver Lab v0.13.0-alpha12" \
              --notes "$NOTES" --draft=false --prerelease
          else
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Amaral Driver Lab v0.13.0-alpha12" \
              --notes "$NOTES" --prerelease
          fi
          gh release upload "$TAG" \
            "release/${APK_NAME}" "release/${SHA_NAME}" --clobber

      - name: Verify prerelease and record status
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" \
            --json tagName,name,url,targetCommitish,publishedAt,isDraft,isPrerelease,assets \
            > /tmp/alpha12-release.json
          test "$(jq -r '.isDraft' /tmp/alpha12-release.json)" = "false"
          test "$(jq -r '.isPrerelease' /tmp/alpha12-release.json)" = "true"
          apk_sha=$(awk '{print $1}' "release/${SHA_NAME}")
          remote_digest=$(jq -r --arg name "$APK_NAME" \
            '.assets[] | select(.name == $name) | .digest' /tmp/alpha12-release.json)
          test "$remote_digest" = "sha256:${apk_sha}"

          git checkout main
          git pull --ff-only origin main
          mkdir -p .release-status
          jq --arg expected "$apk_sha" \
             --arg workflow_run "$GITHUB_RUN_ID" \
             '. + {verification: {expected_apk_sha256: $expected, workflow_run: $workflow_run, status: "published_as_prerelease_and_verified"}}' \
             /tmp/alpha12-release.json > .release-status/v0.13.0-alpha12.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .release-status/v0.13.0-alpha12.json
          git commit -m "release: record verified v0.13.0-alpha12 prerelease" || true
          git push origin HEAD:main
