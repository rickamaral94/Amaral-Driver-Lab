name: Materialize Phase 14 emulator log reports v2

on:
  push:
    branches:
      - agent/phase14-emulator-log-issues
    paths:
      - .github/workflows/materialize-phase14-v2.yml

permissions:
  contents: write

jobs:
  materialize-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase14-emulator-log-issues

      - name: Recover and materialize Phase 14
        shell: bash
        run: |
          set -euo pipefail
          sed -n "/cat > \/tmp\/materialize_phase14.py.gz.b64 <<'PAYLOAD'/,/^[[:space:]]*PAYLOAD$/p" \
            .github/workflows/materialize-phase14.yml \
            | sed '1d;$d;s/^          //' > /tmp/materialize_phase14.py.gz.b64
          base64 --decode /tmp/materialize_phase14.py.gz.b64 \
            | gzip --decompress > /tmp/materialize_phase14.py
          sed -i 's#ROOT = Path(__file__).resolve().parents\[2\]#ROOT = Path.cwd()#' \
            /tmp/materialize_phase14.py
          python3 -m py_compile /tmp/materialize_phase14.py
          python3 /tmp/materialize_phase14.py
          rm -f .github/workflows/materialize-phase14.yml
          rm -f .github/workflows/materialize-phase14-v2.yml
          git diff --check

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Native toolchain
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain

      - name: Upload alpha8 APK
        uses: actions/upload-artifact@v4
        with:
          name: amaral-driver-lab-alpha8-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amaral-driver-lab-alpha8-tests
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
          retention-days: 30

      - name: Commit validated Phase 14
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add emulator log issue reports"
          git push origin HEAD:agent/phase14-emulator-log-issues
