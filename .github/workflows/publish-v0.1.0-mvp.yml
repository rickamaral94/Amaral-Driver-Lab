name: Publish Amaral Driver Lab v0.1.0 MVP

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0.1.0-mvp.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download validated APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p dist
          gh run download 30820798458 \
            --repo "$GITHUB_REPOSITORY" \
            --name amaral-driver-lab-debug \
            --dir dist

      - name: Verify and name release asset
        shell: bash
        run: |
          echo "79a657f4255a14b3b2a2844f11c7140dfd28d0c010e274b336c947587e2440e9  dist/app-debug.apk" | sha256sum --check -
          mv dist/app-debug.apk dist/Amaral-Driver-Lab-v0.1.0-mvp-debug.apk
          (cd dist && sha256sum Amaral-Driver-Lab-v0.1.0-mvp-debug.apk > Amaral-Driver-Lab-v0.1.0-mvp-debug.apk.sha256)

      - name: Prepare release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          Primeira versão pública do Amaral Driver Lab para testes comparativos e reproduzíveis de drivers Vulkan no Android.

          ### Recursos incluídos

          - importação e validação de pacotes ZIP compatíveis com AdrenoTools;
          - seleção do driver do sistema ou de um driver candidato;
          - testes stock, candidato e A/B com alternância AB/BA;
          - captura de métricas, informações do dispositivo, temperatura e logs;
          - exportação do resultado em JSON e integração opcional com GitHub Issues.

          ### Compatibilidade

          - Android 9 / API 28 ou superior;
          - dispositivos arm64-v8a;
          - drivers Vulkan empacotados no formato documentado pelo projeto.

          ### Importante

          Este é um APK experimental de depuração. O driver selecionado é carregado somente no processo de teste do aplicativo e não substitui o driver do sistema. Use apenas pacotes de driver próprios ou com hash verificado.
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.1.0-mvp --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.1.0-mvp \
              dist/Amaral-Driver-Lab-v0.1.0-mvp-debug.apk \
              dist/Amaral-Driver-Lab-v0.1.0-mvp-debug.apk.sha256 \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
            gh release edit v0.1.0-mvp \
              --title "Amaral Driver Lab v0.1.0 MVP" \
              --notes-file release-notes.md \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create v0.1.0-mvp \
              "dist/Amaral-Driver-Lab-v0.1.0-mvp-debug.apk#APK Android arm64-v8a" \
              "dist/Amaral-Driver-Lab-v0.1.0-mvp-debug.apk.sha256#Checksum SHA-256" \
              --repo "$GITHUB_REPOSITORY" \
              --target e21a75f5fc38abc52e342904eef936d79ac0100d \
              --title "Amaral Driver Lab v0.1.0 MVP" \
              --notes-file release-notes.md
          fi
