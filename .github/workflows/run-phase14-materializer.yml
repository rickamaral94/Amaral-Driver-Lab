name: Run Phase 14 materializer

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-phase14-materializer.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Phase 14 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase14-emulator-log-issues
          fetch-depth: 0

      - name: Materialize feature source
        shell: bash
        run: |
          set -euo pipefail
          sed -n "/cat > \/tmp\/materialize_phase14.py.gz.b64 <<'PAYLOAD'/,/^[[:space:]]*PAYLOAD$/p" \
            .github/workflows/materialize-phase14.yml \
            | sed '1d;$d;s/^          //' > /tmp/materialize_phase14.py.gz.b64
          base64 --decode /tmp/materialize_phase14.py.gz.b64 \
            | gzip --decompress > /tmp/materialize_phase14.py
          sed -i 's#ROOT = Path(__file__).resolve().parents\[2\]#ROOT = Path.cwd()#' \
            /tmp/materialize_phase14.py
          python3 -m py_compile /tmp/materialize_phase14.py
          python3 /tmp/materialize_phase14.py
          rm -f .github/workflows/materialize-phase14.yml
          rm -f .github/workflows/materialize-phase14-v2.yml
          rm -f .github/workflows/materialize-phase14-v3.yml
          git diff --check

      - name: Commit Phase 14 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add emulator log issue reports"
          git push origin HEAD:agent/phase14-emulator-log-issues
