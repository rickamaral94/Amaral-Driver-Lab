name: Materialize alpha9 log file extensions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-alpha9-log-file-types.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout alpha9 branch
        uses: actions/checkout@v4
        with:
          ref: agent/alpha9-log-file-extensions
          fetch-depth: 0

      - name: Apply alpha9 changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          build = Path('app/build.gradle')
          text = build.read_text()
          text = text.replace("versionCode 21\n        versionName '0.13.0-alpha8'", "versionCode 22\n        versionName '0.13.0-alpha9'")
          build.write_text(text)

          main = Path('app/src/main/java/com/amaral/driverlab/MainActivity.java')
          text = main.read_text()
          text = text.replace(
              '"Selecione um log gerado pelo emulador. O app identifica aparelho, emulador, jogo, GPU, API gráfica, driver e erros relevantes, remove dados sensíveis e prepara uma issue no projeto.",\n                "Select a log generated by the emulator. The app detects the device, emulator, game, GPU, graphics API, driver and relevant errors, redacts sensitive data and prepares a project issue."',
              '"Selecione um arquivo .txt ou .log gerado pelo emulador. O app identifica aparelho, emulador, jogo, GPU, API gráfica, driver e erros relevantes, remove dados sensíveis e prepara uma issue no projeto.",\n                "Select a .txt or .log file generated by the emulator. The app detects the device, emulator, game, GPU, graphics API, driver and relevant errors, redacts sensitive data and prepares a project issue."')
          text = text.replace(
              'logText("SELECIONAR LOG DO EMULADOR", "SELECT EMULATOR LOG")',
              'logText("SELECIONAR LOG (.TXT / .LOG)", "SELECT LOG (.TXT / .LOG)")')
          text = text.replace(
              '"text/plain", "application/json", "application/octet-stream",\n                "text/x-log", "text/csv"',
              '"text/plain", "text/x-log", "application/log",\n                "application/octet-stream"')
          old = '''                InputStream input = getContentResolver().openInputStream(uri);
                EmulatorLogAnalyzer.ReadResult selected = EmulatorLogAnalyzer.read(
                        input, EmulatorLogAnalyzer.DEFAULT_MAX_BYTES);
                JSONObject device = new JSONObject()'''
          new = '''                String fileName = selectedFileName(uri);
                if (!EmulatorLogFileType.isSupported(fileName)) {
                    throw new IllegalArgumentException(logText(
                            "Formato não suportado. Selecione um arquivo .txt ou .log.",
                            "Unsupported format. Select a .txt or .log file."));
                }
                InputStream input = getContentResolver().openInputStream(uri);
                EmulatorLogAnalyzer.ReadResult selected = EmulatorLogAnalyzer.read(
                        input, EmulatorLogAnalyzer.DEFAULT_MAX_BYTES);
                JSONObject device = new JSONObject()'''
          if old not in text:
              raise SystemExit('MainActivity import block not found')
          text = text.replace(old, new)
          text = text.replace('selectedFileName(uri),\n                        selected.bytesRead,', 'fileName,\n                        selected.bytesRead,')
          main.write_text(text)
          PY

          cat > app/src/main/java/com/amaral/driverlab/EmulatorLogFileType.java <<'EOF'
          package com.amaral.driverlab;

          import java.util.Locale;

          final class EmulatorLogFileType {
              private EmulatorLogFileType() {}

              static boolean isSupported(String fileName) {
                  if (fileName == null) return false;
                  String normalized = fileName.trim().toLowerCase(Locale.ROOT);
                  return normalized.endsWith(".txt") || normalized.endsWith(".log");
              }
          }
          EOF

          cat > app/src/test/java/com/amaral/driverlab/EmulatorLogFileTypeTest.java <<'EOF'
          package com.amaral.driverlab;

          import static org.junit.Assert.assertFalse;
          import static org.junit.Assert.assertTrue;

          import org.junit.Test;

          public final class EmulatorLogFileTypeTest {
              @Test
              public void acceptsTxtAndLogFiles() {
                  assertTrue(EmulatorLogFileType.isSupported("eden.txt"));
                  assertTrue(EmulatorLogFileType.isSupported("game-crash.log"));
                  assertTrue(EmulatorLogFileType.isSupported("EDEN.TXT"));
                  assertTrue(EmulatorLogFileType.isSupported("TURNIP.LOG"));
              }

              @Test
              public void rejectsOtherOrMissingExtensions() {
                  assertFalse(EmulatorLogFileType.isSupported("report.json"));
                  assertFalse(EmulatorLogFileType.isSupported("report.csv"));
                  assertFalse(EmulatorLogFileType.isSupported("report"));
                  assertFalse(EmulatorLogFileType.isSupported(null));
              }
          }
          EOF

          cat > docs/ALPHA9_LOG_FILE_EXTENSIONS.md <<'EOF'
          # Alpha9 — emulator log file extensions

          The emulator-log workflow now explicitly accepts `.txt` and `.log` files.

          - Android's document picker remains compatible with providers that expose log files as plain text, log-specific MIME types or generic binary streams.
          - The selected display name is validated case-insensitively before the file is read.
          - Unsupported extensions receive a clear localized error.
          - Unit tests cover `.txt`, `.log`, uppercase extensions and rejected formats.
          EOF

      - name: Commit alpha9 source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle \
                  app/src/main/java/com/amaral/driverlab/MainActivity.java \
                  app/src/main/java/com/amaral/driverlab/EmulatorLogFileType.java \
                  app/src/test/java/com/amaral/driverlab/EmulatorLogFileTypeTest.java \
                  docs/ALPHA9_LOG_FILE_EXTENSIONS.md
          git diff --cached --check
          git commit -m "feat: accept txt and log emulator files"
          git push origin HEAD:agent/alpha9-log-file-extensions
