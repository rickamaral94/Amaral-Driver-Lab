name: Publish v0.13.0-alpha8 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-alpha8-release.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.13.0-alpha8
      TARGET_SHA: d38421ddf8e8d15f7ac92e81187cceb913543377
      ARTIFACT_ID: '8943215799'
      APK_NAME: Amaral-Driver-Lab-v0.13.0-alpha8.apk
      SHA_NAME: Amaral-Driver-Lab-v0.13.0-alpha8.sha256

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download validated APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output /tmp/alpha8-artifact.zip
          mkdir -p /tmp/alpha8
          unzip -q /tmp/alpha8-artifact.zip -d /tmp/alpha8
          APK_SOURCE="$(find /tmp/alpha8 -type f -name '*.apk' -print -quit)"
          test -n "$APK_SOURCE"
          cp "$APK_SOURCE" "/tmp/$APK_NAME"
          APK_SHA256="$(sha256sum "/tmp/$APK_NAME" | awk '{print $1}')"
          APK_SIZE="$(stat -c '%s' "/tmp/$APK_NAME")"
          test "$APK_SIZE" -gt 1000000
          printf '%s  %s\n' "$APK_SHA256" "$APK_NAME" > "/tmp/$SHA_NAME"
          printf 'APK_SHA256=%s\nAPK_SIZE=%s\n' "$APK_SHA256" "$APK_SIZE" >> "$GITHUB_ENV"

      - name: Create full GitHub release
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<EOF
          ## Amaral Driver Lab v0.13.0-alpha8

          Esta versão adiciona à tela inicial um novo fluxo para transformar logs de emuladores em relatórios técnicos prontos para o GitHub Issues.

          ### Nova seção: log do emulador

          1. Selecione um arquivo de log na página inicial.
          2. O aplicativo analisa o conteúdo localmente.
          3. Revise a prévia com ambiente, driver e falhas encontradas.
          4. Abra uma issue preparada no projeto Amaral Driver Lab.
          5. Relatórios muito grandes usam o fallback seguro pela área de transferência.

          ### Informações detectadas

          - aparelho e versão do Android;
          - emulador e versão;
          - jogo/aplicativo e Title ID ou Program ID;
          - GPU e API gráfica;
          - identidade do driver Turnip, Mesa ou Qualcomm;
          - linhas fatais, erros, avisos e trechos relevantes.

          ### Privacidade e segurança

          - análise totalmente local;
          - nenhum envio automático do log original;
          - remoção automática de e-mails, caminhos pessoais, tokens, segredos e endereços IPv4;
          - limite de importação de 2.000.000 bytes e indicação explícita de truncamento;
          - SHA-256 do conteúdo sanitizado para reprodução técnica;
          - o relatório não afirma automaticamente que o driver Turnip causou o problema.

          ### Validação

          - 105 testes aprovados;
          - 0 falhas e 0 testes ignorados;
          - Android SDK 35;
          - NDK 27.2.12479018 e CMake 3.22.1;
          - compilação Vulkan nativa arm64 aprovada;
          - Source Snapshot aprovado;
          - Android APK workflow 31037497731;
          - APK artifact 8943215799.

          ### Integridade

          SHA-256 da APK: \
          \`$APK_SHA256\`
          EOF
          sed -i 's/^          //' /tmp/release-notes.md

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --target "$TARGET_SHA" \
              --title "Amaral Driver Lab v0.13.0-alpha8" \
              --notes-file /tmp/release-notes.md \
              --latest
            gh release upload "$TAG" "/tmp/$APK_NAME" "/tmp/$SHA_NAME" \
              --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "/tmp/$APK_NAME" "/tmp/$SHA_NAME" \
              --repo "${{ github.repository }}" \
              --target "$TARGET_SHA" \
              --title "Amaral Driver Lab v0.13.0-alpha8" \
              --notes-file /tmp/release-notes.md \
              --latest
          fi

      - name: Verify release and record status
        shell: bash
        run: |
          set -euo pipefail
          release="$(gh api "repos/${{ github.repository }}/releases/tags/$TAG")"
          test "$(jq -r '.draft' <<<"$release")" = "false"
          test "$(jq -r '.prerelease' <<<"$release")" = "false"
          uploaded_digest="$(jq -r --arg name "$APK_NAME" '.assets[] | select(.name == $name) | .digest' <<<"$release")"
          test "$uploaded_digest" = "sha256:$APK_SHA256"
          test "$(jq -r --arg name "$SHA_NAME" '.assets[] | select(.name == $name) | .state' <<<"$release")" = "uploaded"

          mkdir -p .release-status
          jq --arg expected "$APK_SHA256" \
             --arg workflow_run "${{ github.run_id }}" \
             --arg source_workflow "31037497731" \
             --arg source_artifact "$ARTIFACT_ID" \
             '{
                tagName: .tag_name,
                name: .name,
                url: .html_url,
                targetCommitish: .target_commitish,
                publishedAt: .published_at,
                isDraft: .draft,
                isPrerelease: .prerelease,
                assets: [.assets[] | {
                  name: .name,
                  size: .size,
                  contentType: .content_type,
                  state: .state,
                  digest: .digest,
                  downloadCount: .download_count,
                  url: .browser_download_url
                }],
                verification: {
                  expected_apk_sha256: $expected,
                  workflow_run: $workflow_run,
                  source_android_workflow: $source_workflow,
                  source_artifact: $source_artifact,
                  tests: 105,
                  failures: 0,
                  ignored: 0,
                  status: "published_as_full_release_and_verified"
                }
              }' <<<"$release" > ".release-status/$TAG.json"

      - name: Commit verification record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".release-status/$TAG.json"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: record alpha8 full release"
          git push origin HEAD:main
