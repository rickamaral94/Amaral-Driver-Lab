name: Source Snapshot

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: amaral-driver-lab-phase2-source
          path: |
            .github
            app
            telemetry-sdk
            docs
            README.md
            build.gradle
            settings.gradle
            gradle.properties
            gradlew
            gradlew.bat
            gradle
          if-no-files-found: error
          retention-days: 3

  apply_phase13_new_files:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/phase13-ux-redesign'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase13-ux-redesign
          fetch-depth: 0
      - name: Extract Phase 13 components
        shell: bash
        run: |
          set -euo pipefail
          cat .phase13-new.00 .phase13-new.01 .phase13-new.02 .phase13-new.03 \
            > /tmp/phase13-new.tar.xz.b64
          base64 --decode /tmp/phase13-new.tar.xz.b64 > /tmp/phase13-new.tar.xz
          tar -xJf /tmp/phase13-new.tar.xz
          rm -f .phase13-new.*
          rm -f .github/workflows/apply-phase13.yml
          git show origin/agent/phase12-complete-localization:.github/workflows/source-snapshot.yml \
            > .github/workflows/source-snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Phase 13 guided UX components"
          git push origin HEAD:agent/phase13-ux-redesign
