name: Source Snapshot

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase13-ux-redesign
      - name: Inspect alpha6 patch blocks
        shell: bash
        run: |
          set -euo pipefail
          for part in .phase13-alpha6/part-*.b64; do
            decoded="/tmp/$(basename "$part").decoded"
            base64 --decode "$part" > "$decoded"
            echo "=== $(basename "$part") ==="
            printf 'encoded  '
            sha256sum "$part"
            printf 'decoded  '
            sha256sum "$decoded"
            wc -c "$part" "$decoded"
          done
