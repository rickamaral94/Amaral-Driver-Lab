name: Apply Phase 13 alpha6 code

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-alpha6-code:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase13-ux-redesign
          fetch-depth: 0

      - name: Verify, install and publish alpha6 code
        shell: bash
        run: |
          set -euo pipefail
          cat .phase13-alpha6b/part-*.b64 | base64 --decode > /tmp/alpha6-files.tar.gz
          echo '3e86c9f9acd31e7c80a384777a5bb7ff42cd3a0f9fd56cc959a1136050e8fe8e  /tmp/alpha6-files.tar.gz' | sha256sum --check

          cat > /tmp/expected-files.txt <<'EOF'
          app/build.gradle
          app/src/main/java/com/amaral/driverlab/GitHubIssuePublisher.java
          app/src/main/java/com/amaral/driverlab/QualificationOptimizationReport.java
          app/src/test/java/com/amaral/driverlab/QualificationOptimizationReportTest.java
          EOF
          sed -i 's/^          //' /tmp/expected-files.txt
          tar -tzf /tmp/alpha6-files.tar.gz | sort > /tmp/actual-files.txt
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          tar -xzf /tmp/alpha6-files.tar.gz -C .
          rm -rf .phase13-alpha6 .phase13-alpha6b

          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle \
            app/src/main/java/com/amaral/driverlab/GitHubIssuePublisher.java \
            app/src/main/java/com/amaral/driverlab/QualificationOptimizationReport.java \
            app/src/test/java/com/amaral/driverlab/QualificationOptimizationReportTest.java
          git add -A .phase13-alpha6 .phase13-alpha6b
          git commit -m 'Phase 13 alpha6 rich comparative issue report'
          git push origin HEAD:agent/phase13-ux-redesign
