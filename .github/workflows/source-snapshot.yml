name: Inspect Phase 13 alpha5 patch

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-alpha5:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase13-ux-redesign
      - name: Decode and inspect malformed area
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/phase13-alpha5.patch
          for part in .phase13-alpha5/part-*.b64; do
            base64 --decode "$part" >> /tmp/phase13-alpha5.patch
          done
          echo '--- lines 330-390 ---'
          nl -ba /tmp/phase13-alpha5.patch | sed -n '330,390p'
          echo '--- patch diagnostics ---'
          git apply --recount --check /tmp/phase13-alpha5.patch
