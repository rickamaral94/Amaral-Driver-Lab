name: Source Snapshot

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-phase13-alpha3:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/phase13-ux-redesign'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Verify, apply and clean alpha3 patch
        shell: bash
        run: |
          set -euo pipefail
          test -d .phase13-alpha3
          cat .phase13-alpha3/part-*.patch > /tmp/phase13-alpha3.patch
          echo "81bc7bff32d2d269f9ba8f6b5106da499b2d74fcc7119e52dc351eff6e9d1fa5  /tmp/phase13-alpha3.patch" | sha256sum -c -
          git apply --check /tmp/phase13-alpha3.patch
          git apply /tmp/phase13-alpha3.patch
          rm -rf .phase13-alpha3 .github/workflows/apply-phase13-alpha3.yml
          cat > .github/workflows/source-snapshot.yml <<'RESTORE'
          name: Source Snapshot

          on:
            pull_request:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            snapshot:
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - name: Checkout
                  uses: actions/checkout@v4
                - name: Upload source snapshot
                  uses: actions/upload-artifact@v4
                  with:
                    name: amaral-driver-lab-phase2-source
                    path: |
                      .github
                      app
                      telemetry-sdk
                      docs
                      README.md
                      build.gradle
                      settings.gradle
                      gradle.properties
                      gradlew
                      gradlew.bat
                      gradle
                    if-no-files-found: error
                    retention-days: 3
          RESTORE
          sed -i 's/^          //' .github/workflows/source-snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refine recommended Turnip validation flow"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
