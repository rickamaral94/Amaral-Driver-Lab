name: Apply Phase 13 alpha4

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-alpha4:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase13-ux-redesign
          fetch-depth: 0

      - name: Verify and apply alpha4 fix
        shell: bash
        run: |
          set -euo pipefail
          echo "3c0a05ad00969be5a3ad745c692e39abc987a7c50cf49da80a601f5fb8471c86  .phase13-alpha4.patch" | sha256sum -c -
          git apply --check .phase13-alpha4.patch
          git apply .phase13-alpha4.patch
          rm .phase13-alpha4.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix Turnip reference execution identity"
          git push origin "HEAD:agent/phase13-ux-redesign"
