name: Source Snapshot

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/phase9-emulator-telemetry-sdk
          fetch-depth: 0
      - name: Materialize verified Phase 9 source
        if: hashFiles('.phase9/part-00') != ''
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .phase9/part-00)" = "6e3fe06d0927dbe76799b04a27c1e2df4d2f0c21"
          test "$(git hash-object .phase9/part-01)" = "115aaff9ab53840395992ebba9988f603a6144cc"
          test "$(git hash-object .phase9/part-02)" = "f988d58ec972f8a4edc109b9100196477fc57ac7"
          test "$(git hash-object .phase9/part-03)" = "a58119e1d57580bb8e9e5724328867098e6a8339"
          test "$(git hash-object .phase9/part-04)" = "1e24fc042a8c747e35514198b5b45c5c226508b5"
          test "$(git hash-object .phase9/part-05)" = "4bf9b11da54292eca8b59894ef3e7ea987c3fcde"
          test "$(git hash-object .phase9/part-06)" = "bff5462602c8ffb7b973bb7fd8e9d7ad60efb2b5"
          test "$(git hash-object .phase9/part-07)" = "6e092356cfb4ac1e92ccd082a707606c7f9d3c84"
          cat .phase9/part-* > /tmp/phase9.patch.gz.b64
          base64 --decode /tmp/phase9.patch.gz.b64 > /tmp/phase9.patch.gz
          echo 'e82ec6926d28bc939a4c1eae021c3ffc30fc20750fda88ec83a174466bde2fd8  /tmp/phase9.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/phase9.patch.gz > /tmp/phase9.patch
          echo '232ab3e7d0a8fb6438252173496a4cecd3b991245b5f10d00082a247c7845d3c  /tmp/phase9.patch' | sha256sum --check
          git apply --check /tmp/phase9.patch
          git apply /tmp/phase9.patch
          rm -rf .phase9
          git config user.name 'OpenAI Agent'
          git config user.email 'agent@openai.com'
          git add -A
          git commit -m 'feat: add phase 9 emulator telemetry SDK'
          git push origin HEAD:agent/phase9-emulator-telemetry-sdk
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: amaral-driver-lab-phase2-source
          path: |
            .github
            app
            telemetry-sdk
            docs
            README.md
            build.gradle
            settings.gradle
            gradle.properties
            gradlew
            gradlew.bat
            gradle
          if-no-files-found: error
          retention-days: 3
