name: Apply Phase 13 alpha5

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-alpha5:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase13-ux-redesign
          fetch-depth: 0

      - name: Decode, verify and apply alpha5
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/phase13-alpha5.patch
          for part in .phase13-alpha5/part-*.b64; do
            base64 --decode "$part" >> /tmp/phase13-alpha5.patch
          done
          git apply --check /tmp/phase13-alpha5.patch
          git apply /tmp/phase13-alpha5.patch
          rm -rf .phase13-alpha5
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "enrich Turnip optimization issue reports"
          git push origin "HEAD:agent/phase13-ux-redesign"
