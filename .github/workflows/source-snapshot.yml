name: Source Snapshot

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: amaral-driver-lab-phase2-source
          path: |
            .github
            app
            telemetry-sdk
            docs
            README.md
            build.gradle
            settings.gradle
            gradle.properties
            gradlew
            gradlew.bat
            gradle
          if-no-files-found: error
          retention-days: 3

  apply_phase13:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/phase13-ux-redesign'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase13-ux-redesign
          fetch-depth: 0
      - name: Apply Phase 13 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .phase13-b64.00 .phase13-b64.01 .phase13-b64.02 .phase13-b64.03 .phase13-b64.04 \
              .phase13-b64.05 .phase13-b64.06 .phase13-b64.07 .phase13-b64.08 .phase13-b64.09 \
              > /tmp/phase13.patch.gz.b64
          base64 --decode /tmp/phase13.patch.gz.b64 > /tmp/phase13.patch.gz
          gunzip -c /tmp/phase13.patch.gz > /tmp/phase13.patch
          git apply --check /tmp/phase13.patch
          git apply /tmp/phase13.patch
          rm -f .phase13-b64.*
          rm -f .github/workflows/apply-phase13.yml
          cat > .github/workflows/source-snapshot.yml <<'EOF'
          name: Source Snapshot

          on:
            pull_request:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            snapshot:
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - name: Checkout
                  uses: actions/checkout@v4
                - name: Upload source snapshot
                  uses: actions/upload-artifact@v4
                  with:
                    name: amaral-driver-lab-phase2-source
                    path: |
                      .github
                      app
                      telemetry-sdk
                      docs
                      README.md
                      build.gradle
                      settings.gradle
                      gradle.properties
                      gradlew
                      gradlew.bat
                      gradle
                    if-no-files-found: error
                    retention-days: 3
          EOF
          sed -i 's/^          //' .github/workflows/source-snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: redesign UX and Amaral identity"
          git push origin HEAD:agent/phase13-ux-redesign
