name: Inspect Phase 13 alpha5 parts

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-alpha5:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase13-ux-redesign
      - name: Inspect encoded parts
        shell: bash
        run: |
          set -euo pipefail
          ls -la .phase13-alpha5
          for part in .phase13-alpha5/part-*.b64; do
            echo "=== $part ==="
            wc -c "$part"
            out="/tmp/$(basename "$part" .b64).decoded"
            base64 --decode "$part" > "$out"
            wc -c "$out"
            echo '--- first decoded lines ---'
            head -n 4 "$out"
            echo '--- last decoded lines ---'
            tail -n 4 "$out"
          done
