name: Publish v0.13.0-alpha26 prerelease

on:
  push:
    branches: [agent/alpha21-ranking-v5]
    paths: ['.github/workflows/publish-alpha26-prerelease.yml']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
      TAG: v0.13.0-alpha26
      APK_NAME: Amaral-Driver-Lab-v0.13.0-alpha26.apk
      SHA_NAME: Amaral-Driver-Lab-v0.13.0-alpha26.sha256
      CERT_SHA256: 4bb6b5cb69f6b46b50e5870ea7830db5465617fca7a593cfbb5bc4f0885b8173
    steps:
      - name: Checkout prerelease source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Native toolchain
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest :telemetry-sdk:testDebugUnitTest --stacktrace --console=plain

      - name: Build prerelease APK
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain

      - name: Prepare and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" \
            | grep -F "versionName='0.13.0-alpha26'"
          actual_cert=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --print-certs "$apk" | awk -F': ' '/certificate SHA-256 digest/ {print $2; exit}')
          test "$actual_cert" = "$CERT_SHA256"
          mkdir -p release
          cp "$apk" "release/${APK_NAME}"
          (cd release && sha256sum "${APK_NAME}" > "${SHA_NAME}")

      - name: Publish GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          NOTES=$(cat <<'EOF'
          ## Amaral Driver Lab v0.13.0-alpha26

          Correção de diagnóstico na calibração.

          Quando um probe de calibração morria, o erro reportado era `Probe de calibração sem mediana válida` — o sintoma, descartando o diagnóstico que o runner já tinha escrito.

          O efeito prático apareceu numa sessão real com a alpha25: um driver candidato falhava `vkAcquireNextImageKHR` em toda cena visível, cada tentativa durava cerca de um segundo, e a única devolutiva era a `RunnerActivity` piscando. A correção offscreen passava nas mesmas rodadas — ela não usa swapchain — o que faz a falha parecer defeito do aplicativo em vez de defeito do driver.

          ### O que muda
          - o erro passa a nomear a chamada Vulkan, o `VkResult` pelo nome simbólico e o estágio;
          - falha no caminho de swapchain ganha texto próprio — **"O driver não conseguiu apresentar na tela"** — porque é o caso que atinge só as cenas visíveis;
          - sem diagnóstico no resultado, a mensagem antiga é mantida em vez de inventar uma causa.

          ### Exemplo real
          ```
          O driver não conseguiu apresentar na tela.
          vkAcquireNextImageKHR → VK_ERROR_INVALID_EXTERNAL_HANDLE
          (estágio render_visible_frame)
          ```

          ### Instalação
          Mesma assinatura da alpha24 e da alpha25. Instala por cima sem perder histórico.
          EOF
          )
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "Amaral Driver Lab v0.13.0-alpha26" \
            --notes "$NOTES" --prerelease
          gh release upload "$TAG" \
            "release/${APK_NAME}" "release/${SHA_NAME}" --clobber

      - name: Verify prerelease and record status
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" \
            --json tagName,name,url,targetCommitish,publishedAt,isDraft,isPrerelease,assets \
            > /tmp/alpha26-release.json
          test "$(jq -r '.isDraft' /tmp/alpha26-release.json)" = "false"
          test "$(jq -r '.isPrerelease' /tmp/alpha26-release.json)" = "true"
          apk_sha=$(awk '{print $1}' "release/${SHA_NAME}")
          remote_digest=$(jq -r --arg name "$APK_NAME" \
            '.assets[] | select(.name == $name) | .digest' /tmp/alpha26-release.json)
          test "$remote_digest" = "sha256:${apk_sha}"

          git checkout "$GITHUB_REF_NAME"
          git pull --ff-only origin "$GITHUB_REF_NAME"
          mkdir -p .release-status
          jq --arg expected "$apk_sha" --arg certificate "$CERT_SHA256" \
             --arg workflow_run "$GITHUB_RUN_ID" \
             '. + {verification: {expected_apk_sha256: $expected, certificate_sha256: $certificate, workflow_run: $workflow_run, status: "published_as_prerelease_and_verified"}}' \
             /tmp/alpha26-release.json > .release-status/v0.13.0-alpha26.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .release-status/v0.13.0-alpha26.json
          git commit -m "release: record verified v0.13.0-alpha26 prerelease" || true
          git push origin HEAD:"$GITHUB_REF_NAME"
