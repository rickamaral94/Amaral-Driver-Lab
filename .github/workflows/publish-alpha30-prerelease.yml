name: Publish v0.13.0-alpha30 prerelease

on:
  push:
    branches: [agent/alpha21-ranking-v5]
    paths: ['.github/workflows/publish-alpha30-prerelease.yml']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
      TAG: v0.13.0-alpha30
      APK_NAME: Amaral-Driver-Lab-v0.13.0-alpha30.apk
      SHA_NAME: Amaral-Driver-Lab-v0.13.0-alpha30.sha256
      CERT_SHA256: 4bb6b5cb69f6b46b50e5870ea7830db5465617fca7a593cfbb5bc4f0885b8173
    steps:
      - name: Checkout prerelease source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Native toolchain
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest :telemetry-sdk:testDebugUnitTest --stacktrace --console=plain

      - name: Build prerelease APK
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain

      - name: Prepare and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" \
            | grep -F "versionName='0.13.0-alpha30'"
          actual_cert=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --print-certs "$apk" | awk -F': ' '/certificate SHA-256 digest/ {print $2; exit}')
          test "$actual_cert" = "$CERT_SHA256"
          mkdir -p release
          cp "$apk" "release/${APK_NAME}"
          (cd release && sha256sum "${APK_NAME}" > "${SHA_NAME}")

      - name: Publish GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          NOTES=$(cat <<'EOF'
          ## Amaral Driver Lab v0.13.0-alpha30

          Corrige a métrica primária do `emulator_frame_pattern` — a etapa que carrega 70% do peso de performance e que nunca mediu o que dizia medir.

          ### O defeito

          `runEmulatorFrame` juntava as amostras das **cinco passadas** num único vetor e publicava a mediana da mistura como `median_frame_ms`:

          ```cpp
          aggregate.insert(aggregate.end(), samples.begin(), samples.end());
          ...
          << ",\"median_frame_ms\":" << median(aggregate)
          ```

          As passadas custam coisas muito diferentes — `discard_small` é 256×256 com 24 draws, `store_wide` é 960×540 com 96 draws e depth. E cada uma roda por uma **fatia de tempo de parede**, não por contagem fixa. Então o número de amostras de cada passada muda entre rodadas, e a mediana do conjunto pula para a população de outra passada.

          A mediana de uma mistura de cinco distribuições não mede a carga: mede onde a fronteira entre elas calhou de cair na lista ordenada.

          ### O estrago, medido

          Na corrida da issue #68, mesmo par de drivers:

          | Sintoma | |
          |---|---|
          | medianas por rodada | degraus de **4,18 / 3,54 / 2,50 ms** |
          | teste de linearidade | **1,46** contra mínimo de 1,8 → etapa `not_rankable`, com peso 70 |
          | coeficiente de variação | **5,6% contra 10,6%** entre braços idênticos |
          | etapas válidas de performance | **1 de 6** exigidas → índice `null` |

          Também explica as "rodadas rápidas demais" registradas nas issues #66 e #67, que eu tinha atribuído a ruído de braço. Não era ruído, e o diagnóstico anterior estava errado.

          **Todo número de desempenho que essa etapa produziu — issues #65, #66, #67 e #68 — é inválido.**

          ### A correção

          `composite_frame_ms` = **soma das medianas por passada**. Um quadro de emulador são as cinco passadas juntas, então esse é o custo do quadro. A composição fica fixa: não depende de quantas amostras cada passada coube na janela de medição, e dobra quando as repetições dobram — que é exatamente o que o teste de linearidade cobra. O `median_batch_us` da calibração passa a usar a mesma quantidade.

          `pooled_median_frame_ms` continua publicado para comparação com a v2, marcado na `metric_note` como não utilizável para ranking.

          ### Versionamento

          - `emulator_frame_pattern` vai para **workload version 3**, com constante própria (`kEmulatorFrameVersion`) para não arrastar as outras cargas da fase 2;
          - **perfil v8** (`Turnip Recommended Validation v5 · quadro de emulador composto`) difere do v7 em um único campo: a versão dessa carga;
          - **o perfil v7 continua legível** e continua fixando a carga na versão 2. Corrida registrada em v7 usou a métrica agrupada; deixar o v7 migrar para 3 faria duas medições incomparáveis dividirem uma identidade.

          ### Testes

          209 verdes. Os novos:
          - reproduz o defeito em aritmética pura — a mediana agrupada pula de 0,42 para 4,10 só mudando as contagens de amostra, o composto não se move;
          - exige que v7 e v8 tenham `profile_sha256` diferentes e que v7 continue declarando a carga na versão 2.

          Três guardas de versão existentes falharam nesta mudança e foram atualizadas deliberadamente. Elas fizeram o trabalho.

          ### Instalação

          Mesma assinatura desde a alpha24. Instala por cima sem perder histórico.
          EOF
          )
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "Amaral Driver Lab v0.13.0-alpha30" \
            --notes "$NOTES" --prerelease
          gh release upload "$TAG" \
            "release/${APK_NAME}" "release/${SHA_NAME}" --clobber

      - name: Verify prerelease and record status
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" \
            --json tagName,name,url,targetCommitish,publishedAt,isDraft,isPrerelease,assets \
            > /tmp/alpha30-release.json
          test "$(jq -r '.isDraft' /tmp/alpha30-release.json)" = "false"
          test "$(jq -r '.isPrerelease' /tmp/alpha30-release.json)" = "true"
          apk_sha=$(awk '{print $1}' "release/${SHA_NAME}")
          remote_digest=$(jq -r --arg name "$APK_NAME" \
            '.assets[] | select(.name == $name) | .digest' /tmp/alpha30-release.json)
          test "$remote_digest" = "sha256:${apk_sha}"

          git checkout "$GITHUB_REF_NAME"
          git pull --ff-only origin "$GITHUB_REF_NAME"
          mkdir -p .release-status
          jq --arg expected "$apk_sha" --arg certificate "$CERT_SHA256" \
             --arg workflow_run "$GITHUB_RUN_ID" \
             '. + {verification: {expected_apk_sha256: $expected, certificate_sha256: $certificate, workflow_run: $workflow_run, status: "published_as_prerelease_and_verified"}}' \
             /tmp/alpha30-release.json > .release-status/v0.13.0-alpha30.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .release-status/v0.13.0-alpha30.json
          git commit -m "release: record verified v0.13.0-alpha30 prerelease" || true
          git push origin HEAD:"$GITHUB_REF_NAME"
