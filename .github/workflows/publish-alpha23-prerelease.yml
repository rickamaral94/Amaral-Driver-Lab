name: Publish v0.13.0-alpha23 prerelease

on:
  push:
    branches:
      - agent/alpha21-ranking-v5
    paths:
      - '.github/workflows/publish-alpha23-prerelease.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
      TAG: v0.13.0-alpha23
      APK_NAME: Amaral-Driver-Lab-v0.13.0-alpha23.apk
      SHA_NAME: Amaral-Driver-Lab-v0.13.0-alpha23.sha256
    steps:
      - name: Checkout prerelease source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Native toolchain
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest :telemetry-sdk:testDebugUnitTest --stacktrace --console=plain

      - name: Build prerelease APK
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain

      - name: Prepare and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" \
            | grep -F "versionName='0.13.0-alpha23'"
          mkdir -p release
          cp "$apk" "release/${APK_NAME}"
          (
            cd release
            sha256sum "${APK_NAME}" > "${SHA_NAME}"
          )

      - name: Publish GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          NOTES=$(cat <<'EOF'
          ## Amaral Driver Lab v0.13.0-alpha23

          Esta versão leva o ranking Turnip v5 diretamente para o fim da página inicial e corrige o estouro de memória encontrado nos logs da alpha22.

          ### Ranking direto na tela inicial
          - exibe até 10 drivers ordenados pelo Score oficial sem abrir uma seção separada;
          - mostra Vulkan lido em runtime, referências e piso de ruído sem usar porcentagem;
          - mostra claramente quando o ranking está bloqueado pelo teste nulo;
          - explica que sessões livres, como v6 contra v8, alimentam o histórico mas não geram Score sem a âncora v3;
          - oferece o botão de teste nulo no próprio quadro e mantém histórico e detalhes sob demanda;
          - remove o atalho duplicado de ranking da seção Resultados.

          ### Pacote de diagnóstico
          - arquivos e SHA-256 agora são processados em streaming;
          - o app não tenta mais alocar o ZIP inteiro, que na alpha22 ultrapassou o limite de heap de 256 MiB;
          - a conclusão já persistida continua protegida mesmo se um artefato opcional falhar.

          ### Validação
          - testes unitários do app e telemetry SDK executados antes da publicação;
          - teste de regressão cobre criação e hash do bundle por streaming;
          - Java API 28-35 e JNI/C++ arm64 compilados;
          - `aapt` confirma versionName 0.13.0-alpha23;
          - o SHA-256 do APK publicado é verificado após o upload.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Amaral Driver Lab v0.13.0-alpha23" \
              --notes "$NOTES" --draft=false --prerelease
          else
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Amaral Driver Lab v0.13.0-alpha23" \
              --notes "$NOTES" --prerelease
          fi
          gh release upload "$TAG" \
            "release/${APK_NAME}" "release/${SHA_NAME}" --clobber

      - name: Verify prerelease and record status
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" \
            --json tagName,name,url,targetCommitish,publishedAt,isDraft,isPrerelease,assets \
            > /tmp/alpha23-release.json
          test "$(jq -r '.isDraft' /tmp/alpha23-release.json)" = "false"
          test "$(jq -r '.isPrerelease' /tmp/alpha23-release.json)" = "true"
          apk_sha=$(awk '{print $1}' "release/${SHA_NAME}")
          remote_digest=$(jq -r --arg name "$APK_NAME" \
            '.assets[] | select(.name == $name) | .digest' /tmp/alpha23-release.json)
          test "$remote_digest" = "sha256:${apk_sha}"

          git checkout "$GITHUB_REF_NAME"
          git pull --ff-only origin "$GITHUB_REF_NAME"
          mkdir -p .release-status
          jq --arg expected "$apk_sha" \
             --arg workflow_run "$GITHUB_RUN_ID" \
             '. + {verification: {expected_apk_sha256: $expected, workflow_run: $workflow_run, status: "published_as_prerelease_and_verified"}}' \
             /tmp/alpha23-release.json > .release-status/v0.13.0-alpha23.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .release-status/v0.13.0-alpha23.json
          git commit -m "release: record verified v0.13.0-alpha23 prerelease" || true
          git push origin HEAD:"$GITHUB_REF_NAME"
