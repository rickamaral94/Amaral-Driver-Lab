name: Publish v0.13.0-alpha21 prerelease

on:
  push:
    branches:
      - agent/alpha21-ranking-v5
    paths:
      - '.github/workflows/publish-alpha21-prerelease.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
      TAG: v0.13.0-alpha21
      APK_NAME: Amaral-Driver-Lab-v0.13.0-alpha21.apk
      SHA_NAME: Amaral-Driver-Lab-v0.13.0-alpha21.sha256
    steps:
      - name: Checkout prerelease source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Native toolchain
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest :telemetry-sdk:testDebugUnitTest --stacktrace --console=plain

      - name: Build prerelease APK
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain

      - name: Prepare and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" \
            | grep -F "versionName='0.13.0-alpha21'"
          mkdir -p release
          cp "$apk" "release/${APK_NAME}"
          (
            cd release
            sha256sum "${APK_NAME}" > "${SHA_NAME}"
          )

      - name: Publish GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          NOTES=$(cat <<'EOF'
          ## Amaral Driver Lab v0.13.0-alpha21

          Esta versão restaura o fluxo da qualificação após as pausas observadas nas alpha18-alpha20 e introduz a primeira implementação do Ranking Turnip v5.

          ### Estabilidade da qualificação
          - separa falha controlada de workload de crash real do processo `:runner`;
          - preserva o artefato da suite que falhou e continua quando a falha é diagnosticável;
          - mantém pausa e bundle parcial somente para morte, timeout ou crash real do runner;
          - adiciona estágios detalhados de shader/pipeline no log da cena GPU Stress;
          - calibra o braço Turnip correto em comparações sistema x Turnip;
          - força relógio CPU monotônico equivalente nos dois braços ao comparar blob e Turnip.

          ### Ranking Turnip v5
          - ranking local em três estados: ranqueado, desclassificado e inelegível;
          - score inteiro sem teto contra a âncora v3 fixa, com Sustentado e p1% low;
          - teste nulo obrigatório, piso de ruído, IC95, empates e bloqueio por viés do harness;
          - histórico append-only por época, importação assinada e isolamento de outro aparelho;
          - modo sem injeção para o driver do sistema e referência `vs_stock` somente quando medida;
          - tela de ranking com detalhes, histórico, ordenação por Score ou p1% low e motivos estruturados.

          ### Validação
          - 190 testes unitários aprovados;
          - Java API 28-35 e JNI/C++ arm64 compilados;
          - `aapt` confirma versionName 0.13.0-alpha21;
          - o SHA-256 do APK publicado é verificado após o upload.

          Se o Android informar conflito de assinatura ao atualizar uma build antiga, exporte os logs, desinstale a versão anterior e instale esta alpha21.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Amaral Driver Lab v0.13.0-alpha21" \
              --notes "$NOTES" --draft=false --prerelease
          else
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Amaral Driver Lab v0.13.0-alpha21" \
              --notes "$NOTES" --prerelease
          fi
          gh release upload "$TAG" \
            "release/${APK_NAME}" "release/${SHA_NAME}" --clobber

      - name: Verify prerelease and record status
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" \
            --json tagName,name,url,targetCommitish,publishedAt,isDraft,isPrerelease,assets \
            > /tmp/alpha21-release.json
          test "$(jq -r '.isDraft' /tmp/alpha21-release.json)" = "false"
          test "$(jq -r '.isPrerelease' /tmp/alpha21-release.json)" = "true"
          apk_sha=$(awk '{print $1}' "release/${SHA_NAME}")
          remote_digest=$(jq -r --arg name "$APK_NAME" \
            '.assets[] | select(.name == $name) | .digest' /tmp/alpha21-release.json)
          test "$remote_digest" = "sha256:${apk_sha}"

          git checkout "$GITHUB_REF_NAME"
          git pull --ff-only origin "$GITHUB_REF_NAME"
          mkdir -p .release-status
          jq --arg expected "$apk_sha" \
             --arg workflow_run "$GITHUB_RUN_ID" \
             '. + {verification: {expected_apk_sha256: $expected, workflow_run: $workflow_run, status: "published_as_prerelease_and_verified"}}' \
             /tmp/alpha21-release.json > .release-status/v0.13.0-alpha21.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .release-status/v0.13.0-alpha21.json
          git commit -m "release: record verified v0.13.0-alpha21 prerelease" || true
          git push origin HEAD:"$GITHUB_REF_NAME"
