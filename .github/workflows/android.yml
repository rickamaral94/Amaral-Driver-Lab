name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Native toolchain
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          ./gradlew :app:assembleDebug --stacktrace --console=plain > native-build.log 2>&1
          status=$?
          grep -E "(^|[[:space:]])(error:|fatal error:|CMake Error|ninja: error|FAILURE:|What went wrong:|Execution failed for task|Caused by:)" \
            native-build.log | tail -n 250 > native-build-errors.txt || true
          if [ ! -s native-build-errors.txt ]; then
            tail -n 250 native-build.log > native-build-errors.txt
          fi
          cat native-build-errors.txt
          exit "$status"

      - name: Upload native build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amaral-driver-lab-native-build-diagnostics
          path: |
            native-build-errors.txt
            native-build.log
            app/src/main/cpp/render_correctness.cpp
          if-no-files-found: warn
          retention-days: 7

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amaral-driver-lab-unit-tests
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: amaral-driver-lab-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
