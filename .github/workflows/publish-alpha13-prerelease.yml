name: Publish v0.13.0-alpha13 prerelease

on:
  push:
    branches:
      - agent/phase2-dynamic-range-v2-pr
    paths:
      - '.github/workflows/publish-alpha13-prerelease.yml'
      - 'app/src/test/java/com/amaral/driverlab/FullV3ScoreTest.java'
      - 'app/src/test/java/com/amaral/driverlab/RecommendedTurnipProfileTest.java'
      - 'app/src/test/java/com/amaral/driverlab/VisualSceneContractTest.java'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
      TAG: v0.13.0-alpha13
      APK_NAME: Amaral-Driver-Lab-v0.13.0-alpha13.apk
      SHA_NAME: Amaral-Driver-Lab-v0.13.0-alpha13.sha256
    steps:
      - name: Checkout prerelease source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Native toolchain
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest :telemetry-sdk:testDebugUnitTest --stacktrace --console=plain

      - name: Build prerelease APK
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/${APK_NAME}"
          (
            cd release
            sha256sum "${APK_NAME}" > "${SHA_NAME}"
          )

      - name: Publish GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          NOTES=$(cat <<'EOF'
          ## Amaral Driver Lab v0.13.0-alpha13

          This prerelease is the implementation checkpoint for the Phase 2 dynamic-range recalibration.

          ### Benchmark calibration
          - adds workload v2 calibration targeting 8–16 ms measured batches, with a 2 ms validity floor;
          - persists calibration by hardware and workload configuration and shares one multiplier between reference and candidate;
          - validates m/2m linearity and blocks normalized durations when scaling is nonlinear;
          - uses explicit repetition units, including complete render passes for visual and tiling workloads;
          - keeps shader cold runs isolated with distinct variants and disabled Mesa disk cache.

          ### Statistical and thermal safeguards
          - uses an independent pilot to fix the paired-round count once, with no optional stopping;
          - records calibration drift, thermal drift, and a 2,700-second operational ceiling;
          - validates 1%, 3%, and 10% injected effects using additional GPU-domain work only;
          - excludes unconfirmed runtime driver identities and workload versions from ranking, dataset, and bisect.

          ### Historical safety
          - keeps Full profiles v1–v5 bound to workload v1;
          - introduces Recommended Full v6 with workload v2;
          - includes deterministic driver-identity and workload-version audits.

          ### Validation status
          - Android and telemetry unit tests execute before publication;
          - Vulkan shaders, native C++, and the arm64 debug APK build before publication;
          - the APK SHA-256 is generated and verified against the uploaded release asset.

          This is a test prerelease, not a stable release. Scientific closure still requires two physical Full Recommended v6 runs on the Odin 2 Portal / Adreno A740. No physical performance result is claimed here.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Amaral Driver Lab v0.13.0-alpha13" \
              --notes "$NOTES" --draft=false --prerelease
          else
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Amaral Driver Lab v0.13.0-alpha13" \
              --notes "$NOTES" --prerelease
          fi
          gh release upload "$TAG" \
            "release/${APK_NAME}" "release/${SHA_NAME}" --clobber

      - name: Verify prerelease and record status
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" \
            --json tagName,name,url,targetCommitish,publishedAt,isDraft,isPrerelease,assets \
            > /tmp/alpha13-release.json
          test "$(jq -r '.isDraft' /tmp/alpha13-release.json)" = "false"
          test "$(jq -r '.isPrerelease' /tmp/alpha13-release.json)" = "true"
          apk_sha=$(awk '{print $1}' "release/${SHA_NAME}")
          remote_digest=$(jq -r --arg name "$APK_NAME" \
            '.assets[] | select(.name == $name) | .digest' /tmp/alpha13-release.json)
          test "$remote_digest" = "sha256:${apk_sha}"

          git checkout "$GITHUB_REF_NAME"
          git pull --ff-only origin "$GITHUB_REF_NAME"
          mkdir -p .release-status
          jq --arg expected "$apk_sha" \
             --arg workflow_run "$GITHUB_RUN_ID" \
             '. + {verification: {expected_apk_sha256: $expected, workflow_run: $workflow_run, status: "published_as_prerelease_and_verified"}}' \
             /tmp/alpha13-release.json > .release-status/v0.13.0-alpha13.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .release-status/v0.13.0-alpha13.json
          git commit -m "release: record verified v0.13.0-alpha13 prerelease" || true
          git push origin HEAD:"$GITHUB_REF_NAME"
