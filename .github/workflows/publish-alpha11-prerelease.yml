name: Publish v0.13.0-alpha11 prerelease

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-alpha11-prerelease.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
      TAG: v0.13.0-alpha11
      APK_NAME: Amaral-Driver-Lab-v0.13.0-alpha11.apk
      SHA_NAME: Amaral-Driver-Lab-v0.13.0-alpha11.sha256
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Native toolchain
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --console=plain

      - name: Build prerelease APK
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/${APK_NAME}"
          (
            cd release
            sha256sum "${APK_NAME}" > "${SHA_NAME}"
          )

      - name: Publish GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          NOTES=$(cat <<'EOF'
          ## Amaral Driver Lab v0.13.0-alpha11

          This prerelease introduces the new GPU Stress 3D visual benchmark and incorporates it into the recommended Full test.

          ### New GPU Stress 3D workload
          - 1280×720 internal rendering;
          - 768 procedural 3D cubes and 27,648 vertices per frame;
          - depth testing, orbital camera, four lights and six-octave procedural materials;
          - a final post-processing pass with 19 texture samples;
          - deterministic checkpoints at frames 30, 90 and 150;
          - mandatory A/B visual correctness gate before performance conclusions.

          ### Recommended Full v5
          - the Recommended Validation v2 profile now runs nine stages;
          - GPU Stress 3D is included as `visual_gpu_stress` with 20% weight;
          - total profile weight remains normalized to 100%;
          - Full v1–v3 and Recommended v4 remain verifiable historical series and are never mixed with v5 rankings.

          ### Validation
          - Android unit tests executed in GitHub Actions;
          - Vulkan shaders compiled for Vulkan 1.0 by the Android NDK toolchain;
          - native C++ and arm64 debug APK built in GitHub Actions;
          - APK SHA-256 generated and verified against the uploaded release asset.

          This is a prerelease intended for real-device validation, especially on the Odin 2 Portal, before promotion to a stable release.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Amaral Driver Lab v0.13.0-alpha11" \
              --notes "$NOTES" --draft=false --prerelease
          else
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Amaral Driver Lab v0.13.0-alpha11" \
              --notes "$NOTES" --prerelease
          fi
          gh release upload "$TAG" \
            "release/${APK_NAME}" "release/${SHA_NAME}" --clobber

      - name: Verify prerelease and record status
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" \
            --json tagName,name,url,targetCommitish,publishedAt,isDraft,isPrerelease,assets \
            > /tmp/alpha11-release.json
          test "$(jq -r '.isDraft' /tmp/alpha11-release.json)" = "false"
          test "$(jq -r '.isPrerelease' /tmp/alpha11-release.json)" = "true"
          apk_sha=$(awk '{print $1}' "release/${SHA_NAME}")
          remote_digest=$(jq -r --arg name "$APK_NAME" \
            '.assets[] | select(.name == $name) | .digest' /tmp/alpha11-release.json)
          test "$remote_digest" = "sha256:${apk_sha}"

          git checkout main
          git pull --ff-only origin main
          mkdir -p .release-status
          jq --arg expected "$apk_sha" \
             --arg workflow_run "$GITHUB_RUN_ID" \
             '. + {verification: {expected_apk_sha256: $expected, workflow_run: $workflow_run, status: "published_as_prerelease_and_verified"}}' \
             /tmp/alpha11-release.json > .release-status/v0.13.0-alpha11.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .release-status/v0.13.0-alpha11.json
          git commit -m "release: record verified v0.13.0-alpha11 prerelease" || true
          git push origin HEAD:main
