name: Publish v0.13.0-alpha7 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-alpha7-release.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.13.0-alpha7
      TARGET_SHA: 9f4020527f9807d960aaad03e1fe05f5f7a5da1b
      ARTIFACT_ID: '8926442446'
      EXPECTED_APK_SHA256: ed315a5d5a353aa10b2138693f3141f5751f114c7d47bcf53e871c93302a3c28
      APK_NAME: Amaral-Driver-Lab-v0.13.0-alpha7.apk
      SHA_NAME: Amaral-Driver-Lab-v0.13.0-alpha7.sha256
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download validated APK artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output /tmp/amaral-alpha7-artifact.zip
          mkdir -p /tmp/amaral-alpha7
          unzip -q /tmp/amaral-alpha7-artifact.zip -d /tmp/amaral-alpha7
          APK_SOURCE="$(find /tmp/amaral-alpha7 -type f -name '*.apk' -print -quit)"
          test -n "$APK_SOURCE"
          cp "$APK_SOURCE" "/tmp/$APK_NAME"
          echo "$EXPECTED_APK_SHA256  /tmp/$APK_NAME" | sha256sum --check
          printf '%s  %s\n' "$EXPECTED_APK_SHA256" "$APK_NAME" > "/tmp/$SHA_NAME"

      - name: Create or update GitHub release
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          ## Amaral Driver Lab v0.13.0-alpha7

          Correção emergencial do envio de relatórios para issues do GitHub.

          ### Corrigido

          - elimina o erro `Your request URL is too long` ao enviar relatórios detalhados;
          - calcula o tamanho da URL depois da codificação de Markdown e Unicode;
          - relatórios curtos continuam abrindo preenchidos automaticamente;
          - relatórios extensos são copiados integralmente para a área de transferência;
          - o GitHub abre com uma URL curta e o título já preenchido;
          - o aplicativo orienta o usuário a colar o relatório na descrição;
          - remove cortes de 1.800 e 8.000 caracteres, evitando perda de dados;
          - aplica a correção às issues individuais e às issues de Qualification.

          ### Validação

          - 101 testes JVM aprovados;
          - 0 falhas e 0 testes ignorados;
          - Source Snapshot aprovado;
          - Android SDK 35;
          - NDK 27.2.12479018 e CMake 3.22.1;
          - compilação Vulkan arm64 e APK aprovadas;
          - workflow Android APK `30996593269`.

          ### Integridade

          SHA-256 da APK:

          `ed315a5d5a353aa10b2138693f3141f5751f114c7d47bcf53e871c93302a3c28`

          Esta continua sendo uma versão alpha. Depois de instalar, execute novamente o envio da issue no Odin 2 Portal e cole o conteúdo copiado no campo de descrição do GitHub.
          EOF
          sed -i 's/^          //' /tmp/release-notes.md

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --target "$TARGET_SHA" \
              --title "Amaral Driver Lab v0.13.0-alpha7" \
              --notes-file /tmp/release-notes.md \
              --prerelease
            gh release upload "$TAG" "/tmp/$APK_NAME" "/tmp/$SHA_NAME" \
              --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "/tmp/$APK_NAME" "/tmp/$SHA_NAME" \
              --repo "${{ github.repository }}" \
              --target "$TARGET_SHA" \
              --title "Amaral Driver Lab v0.13.0-alpha7" \
              --notes-file /tmp/release-notes.md \
              --prerelease
          fi

      - name: Record publication status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release-status
          gh release view "$TAG" --repo "${{ github.repository }}" \
            --json tagName,isPrerelease,publishedAt,targetCommitish,url,assets \
            > /tmp/release.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path('/tmp/release.json').read_text())
          release['verification'] = {
              'apk_name': 'Amaral-Driver-Lab-v0.13.0-alpha7.apk',
              'sha256_file': 'Amaral-Driver-Lab-v0.13.0-alpha7.sha256',
              'expected_apk_sha256': 'ed315a5d5a353aa10b2138693f3141f5751f114c7d47bcf53e871c93302a3c28',
              'workflow_run': '${{ github.run_id }}',
              'status': 'published_and_verified'
          }
          Path('.release-status/v0.13.0-alpha7.json').write_text(
              json.dumps(release, indent=2, ensure_ascii=False) + '\n'
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .release-status/v0.13.0-alpha7.json
          git commit -m "chore: record v0.13.0-alpha7 release" || true
          git push
