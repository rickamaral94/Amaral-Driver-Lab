name: Publish Amaral Driver Lab v0.1.1 MVP

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0.1.1-mvp.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download validated APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p dist
          gh run download 30824681431 \
            --repo "$GITHUB_REPOSITORY" \
            --name amaral-driver-lab-debug \
            --dir dist

      - name: Verify and name release asset
        shell: bash
        run: |
          echo "4c82f9c12ef567808385fd2232fb3b05b5c6b7fe7135f971fd08e3b41421d6e9  dist/app-debug.apk" | sha256sum --check -
          mv dist/app-debug.apk dist/Amaral-Driver-Lab-v0.1.1-mvp-debug.apk
          (cd dist && sha256sum Amaral-Driver-Lab-v0.1.1-mvp-debug.apk > Amaral-Driver-Lab-v0.1.1-mvp-debug.apk.sha256)

      - name: Prepare release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          Atualização visual e de documentação do Amaral Driver Lab.

          ### Novidades

          - novo ícone oficial baseado no avatar A / AMARAL;
          - ícones quadrado, circular e adaptativo para diferentes launchers Android;
          - tutorial completo de instalação, importação, comparação A/B e exportação no README;
          - versão do aplicativo atualizada para 0.1.1-mvp.

          O workload e o cálculo do benchmark permanecem iguais aos da v0.1.0-mvp.

          ### Compatibilidade

          - Android 9 / API 28 ou superior;
          - dispositivos arm64-v8a;
          - pacotes Vulkan no formato AdrenoTools documentado pelo projeto.

          ### Instalação

          Este é um APK experimental de depuração. Se a v0.1.0-mvp estiver instalada, exporte resultados importantes e desinstale-a antes, pois builds de depuração gerados em execuções diferentes podem usar assinaturas incompatíveis.
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.1.1-mvp --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.1.1-mvp \
              dist/Amaral-Driver-Lab-v0.1.1-mvp-debug.apk \
              dist/Amaral-Driver-Lab-v0.1.1-mvp-debug.apk.sha256 \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
            gh release edit v0.1.1-mvp \
              --title "Amaral Driver Lab v0.1.1 MVP" \
              --notes-file release-notes.md \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create v0.1.1-mvp \
              "dist/Amaral-Driver-Lab-v0.1.1-mvp-debug.apk#APK Android arm64-v8a" \
              "dist/Amaral-Driver-Lab-v0.1.1-mvp-debug.apk.sha256#Checksum SHA-256" \
              --repo "$GITHUB_REPOSITORY" \
              --target 387b58addd2f76cc5190b2fd9ce3411f247cd706 \
              --title "Amaral Driver Lab v0.1.1 MVP" \
              --notes-file release-notes.md
          fi
