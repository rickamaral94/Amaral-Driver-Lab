name: Phase 12 test diagnostics

on:
  push:
    branches:
      - agent/phase12-complete-localization
    paths:
      - '.github/workflows/phase12-test-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase12-complete-localization
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'

      - name: Run tests and capture diagnostics
        id: tests
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :telemetry-sdk:testDebugUnitTest --stacktrace --info \
            > phase12-test-output.txt 2>&1
          status=$?
          echo "exit_code=$status" > phase12-test-status.txt
          find app/build/test-results telemetry-sdk/build/test-results \
            -type f \( -name '*.xml' -o -name '*.txt' \) -print -exec sh -c \
            'echo "\n===== $1 =====" >> phase12-test-results.txt; cat "$1" >> phase12-test-results.txt' _ {} \; 2>/dev/null || true
          exit 0

      - name: Commit diagnostic output
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phase12-test-output.txt phase12-test-status.txt phase12-test-results.txt
          git commit -m 'chore: capture Phase 12 test diagnostics'
          git push origin HEAD:agent/phase12-complete-localization
