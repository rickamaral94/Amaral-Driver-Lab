name: Publish v0.13.0-alpha33 prerelease

on:
  push:
    branches: [agent/alpha21-ranking-v5]
    paths: ['.github/workflows/publish-alpha33-prerelease.yml']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
      TAG: v0.13.0-alpha33
      APK_NAME: Amaral-Driver-Lab-v0.13.0-alpha33.apk
      SHA_NAME: Amaral-Driver-Lab-v0.13.0-alpha33.sha256
      CERT_SHA256: 4bb6b5cb69f6b46b50e5870ea7830db5465617fca7a593cfbb5bc4f0885b8173
    steps:
      - name: Checkout prerelease source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Native toolchain
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest :telemetry-sdk:testDebugUnitTest --stacktrace --console=plain

      - name: Build prerelease APK
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain

      - name: Prepare and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" \
            | grep -F "versionName='0.13.0-alpha33'"
          actual_cert=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --print-certs "$apk" | awk -F': ' '/certificate SHA-256 digest/ {print $2; exit}')
          test "$actual_cert" = "$CERT_SHA256"
          mkdir -p release
          cp "$apk" "release/${APK_NAME}"
          (cd release && sha256sum "${APK_NAME}" > "${SHA_NAME}")

      - name: Publish GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          NOTES=$(cat <<'EOF'
          ## Amaral Driver Lab v0.13.0-alpha33

          O `emulator_frame_pattern` deixa de imitar uma suposição e passa a imitar uma medição.

          ### De onde veio a forma nova

          Traço de API do Eden v0.2.1 rodando **Mario Kart 8 Deluxe** na Adreno 740, com o driver Turnip `git-f0bcf54P10`: **353.589 render passes e 1.126.192 draws em 108,6 s**.

          O que ele mostrou, e que a carga anterior contradizia:

          | | v3 (suposição) | medido |
          |---|---|---|
          | draws por passe | 24, 24, 48, 96, 96 | **mediana 1** |
          | passes sem nenhum draw | 0 % | **17,8 %** |
          | passes com exatamente um draw | 0 % | **74,9 %** |
          | maior alvo | 960 × 540 | **1920 × 1080** (44,7 % dos passes) |
          | menor alvo | 256 × 256 | **16 × 16** |
          | passes por quadro | 5 | **~93** |

          A média real é 3,19 draws por passe, mas ela vem de uma cauda curta e pesada: **3 % dos passes levam 67 % dos draws**, com até 295 num passe só. E há um alvo 1024×1024 com ~20 draws por passe, com cara de mapa de sombra.

          Com 24 a 96 draws por passe, o custo fixo do tiling é amortizado — que é exatamente o oposto da condição que torna emulação difícil para um tiler. A carga de peso 70 estava medindo o caso fácil.

          ### A forma nova

          93 render passes por quadro, reproduzindo o mix medido:

          | | nosso | real |
          |---|---:|---:|
          | draws por passe (média) | 3,20 | 3,19 |
          | passes sem draw | 18,3 % | 17,8 % |
          | passes com um draw | 75,3 % | 74,9 % |
          | 1920 × 1080 | 45,2 % | 44,7 % |

          Ordem deliberada: mapa de sombra primeiro, geometria em tela cheia intercalada com os alvos pequenos, e a cadeia descendente de pós-processamento no fim. Agrupar os 42 passes de 1080p deixaria o mesmo alvo quente de um jeito que o emulador não produz.

          **A unidade de repetição passa a ser o quadro inteiro**, não o render pass. Um quadro a mais custa um quadro a mais — que é o que o teste de linearidade cobra.

          ### O que não foi medido, e por isso não é modelado

          O traço registra área e contagem de draws, **não** o que cada render pass faz com o anexo. Então todos os alvos usam `STORE`, que é a escolha cara, e a razão `store_penalty_ratio` da versão anterior **saiu**: ela comparava uma suposição com outra.

          ### Versionamento

          - `emulator_frame_pattern` vai para **workload version 4**;
          - **perfil v10** — `Turnip Recommended Validation v7 · quadro medido do Eden`;
          - v9 e v8 continuam legíveis e continuam fixando a carga na versão 3, v7 na versão 2. Guarda nova de teste exige exatamente isso: `emulatorV8Steps` lia a constante direto do contrato, então subir a constante reescrevia em silêncio o que v8 e v9 significavam.

          ### Testes

          211 verdes. O código nativo foi compilado com o clang do NDK antes de publicar, não só testado no Java.

          ### Instalação

          Mesma assinatura desde a alpha24. Instala por cima sem perder histórico.
          EOF
          )
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "Amaral Driver Lab v0.13.0-alpha33" \
            --notes "$NOTES" --prerelease
          gh release upload "$TAG" \
            "release/${APK_NAME}" "release/${SHA_NAME}" --clobber

      - name: Verify prerelease and record status
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" \
            --json tagName,name,url,targetCommitish,publishedAt,isDraft,isPrerelease,assets \
            > /tmp/alpha33-release.json
          test "$(jq -r '.isDraft' /tmp/alpha33-release.json)" = "false"
          test "$(jq -r '.isPrerelease' /tmp/alpha33-release.json)" = "true"
          apk_sha=$(awk '{print $1}' "release/${SHA_NAME}")
          remote_digest=$(jq -r --arg name "$APK_NAME" \
            '.assets[] | select(.name == $name) | .digest' /tmp/alpha33-release.json)
          test "$remote_digest" = "sha256:${apk_sha}"

          git checkout "$GITHUB_REF_NAME"
          git pull --ff-only origin "$GITHUB_REF_NAME"
          mkdir -p .release-status
          jq --arg expected "$apk_sha" --arg certificate "$CERT_SHA256" \
             --arg workflow_run "$GITHUB_RUN_ID" \
             '. + {verification: {expected_apk_sha256: $expected, certificate_sha256: $certificate, workflow_run: $workflow_run, status: "published_as_prerelease_and_verified"}}' \
             /tmp/alpha33-release.json > .release-status/v0.13.0-alpha33.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .release-status/v0.13.0-alpha33.json
          git commit -m "release: record verified v0.13.0-alpha33 prerelease" || true
          git push origin HEAD:"$GITHUB_REF_NAME"
