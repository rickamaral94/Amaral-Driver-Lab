name: Run alpha7 draft URL fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-alpha7-draft-url-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-github-draft-url-alpha7
          fetch-depth: 0

      - name: Apply patch
        run: python3 tools/apply_alpha7_draft_url_fix.py

      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle \
            app/src/main/java/com/amaral/driverlab/GitHubIssuePublisher.java \
            app/src/main/res/values/strings.xml \
            app/src/main/res/values-pt-rBR/strings.xml \
            app/src/test/java/com/amaral/driverlab/GitHubIssuePublisherDraftTest.java
          git commit -m "fix: avoid oversized GitHub issue draft URLs"
          git push origin HEAD:agent/fix-github-draft-url-alpha7
