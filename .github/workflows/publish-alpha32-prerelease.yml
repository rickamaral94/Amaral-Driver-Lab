name: Publish v0.13.0-alpha32 prerelease

on:
  push:
    branches: [agent/alpha21-ranking-v5]
    paths: ['.github/workflows/publish-alpha32-prerelease.yml']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
      TAG: v0.13.0-alpha32
      APK_NAME: Amaral-Driver-Lab-v0.13.0-alpha32.apk
      SHA_NAME: Amaral-Driver-Lab-v0.13.0-alpha32.sha256
      CERT_SHA256: 4bb6b5cb69f6b46b50e5870ea7830db5465617fca7a593cfbb5bc4f0885b8173
    steps:
      - name: Checkout prerelease source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Native toolchain
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest :telemetry-sdk:testDebugUnitTest --stacktrace --console=plain

      - name: Build prerelease APK
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain

      - name: Prepare and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" \
            | grep -F "versionName='0.13.0-alpha32'"
          actual_cert=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --print-certs "$apk" | awk -F': ' '/certificate SHA-256 digest/ {print $2; exit}')
          test "$actual_cert" = "$CERT_SHA256"
          mkdir -p release
          cp "$apk" "release/${APK_NAME}"
          (cd release && sha256sum "${APK_NAME}" > "${SHA_NAME}")

      - name: Publish GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          NOTES=$(cat <<'EOF'
          ## Amaral Driver Lab v0.13.0-alpha32

          **A alpha30 e a alpha31 abortavam a suíte.** Esta corrige. Instala esta e ignora as duas.

          ### O que quebrava

          A suíte terminava o `correctness_pre` e parava. Nenhuma falha registrada, nenhum processo de runner para a etapa seguinte — porque o aborto acontecia no coordenador, **antes** de lançar o runner.

          `WorkloadContract.isSupportedVersion` tinha o teto de versão escrito à mão:

          ```java
          return version == 1 || version == 2;
          ```

          A alpha30 subiu o `emulator_frame_pattern` para a versão 3. A alpha31 subiu as quatro cenas visíveis para a versão 3. **As cinco passaram a ser recusadas pelo próprio aplicativo**, na versão que o perfil declarava.

          ### Por que os testes não pegaram

          Todas as guardas afirmavam `isSupportedVersion(id, 1)` e `isSupportedVersion(id, 2)` — literais. Nenhuma afirmava que uma carga aceita **a versão que ela mesma declara corrente**. Subir de 2 para 3 passava a suíte inteira e falhava no aparelho.

          ### A correção

          O teto passa a ser derivado, não escrito:

          ```java
          return version >= 1 && version <= versionFor(workloadId);
          ```

          E a invariante que faltava virou teste: para toda carga, `isSupportedVersion(id, versionFor(id))` precisa ser verdadeira, `versionFor(id) + 1` precisa ser falsa e `0` precisa ser falsa. Simulada contra a lógica antiga, ela reprova as cinco cargas em v3 — teria pego os dois lançamentos.

          ### O que já estava certo nas duas anteriores

          Continua valendo, agora executável:

          - `emulator_frame_pattern` v3 — `composite_frame_ms`, soma das medianas por passada, em vez da mediana das cinco passadas embaralhadas;
          - cenas visíveis v3 — bracket de timestamp da GPU contendo só o laço de repetições, sem a cópia de checkpoint, as transições de layout e o blit para a swapchain;
          - perfil v9 — 70 no `emulator_frame`, 30 no `trace_mixed`, 0 no `shader_compile`;
          - `minimum_valid_performance_steps` limitado pelo número de etapas que carregam peso.

          ### Testes

          211 verdes.

          ### Instalação

          Mesma assinatura desde a alpha24. Instala por cima sem perder histórico.
          EOF
          )
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "Amaral Driver Lab v0.13.0-alpha32" \
            --notes "$NOTES" --prerelease
          gh release upload "$TAG" \
            "release/${APK_NAME}" "release/${SHA_NAME}" --clobber

      - name: Verify prerelease and record status
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" \
            --json tagName,name,url,targetCommitish,publishedAt,isDraft,isPrerelease,assets \
            > /tmp/alpha32-release.json
          test "$(jq -r '.isDraft' /tmp/alpha32-release.json)" = "false"
          test "$(jq -r '.isPrerelease' /tmp/alpha32-release.json)" = "true"
          apk_sha=$(awk '{print $1}' "release/${SHA_NAME}")
          remote_digest=$(jq -r --arg name "$APK_NAME" \
            '.assets[] | select(.name == $name) | .digest' /tmp/alpha32-release.json)
          test "$remote_digest" = "sha256:${apk_sha}"

          git checkout "$GITHUB_REF_NAME"
          git pull --ff-only origin "$GITHUB_REF_NAME"
          mkdir -p .release-status
          jq --arg expected "$apk_sha" --arg certificate "$CERT_SHA256" \
             --arg workflow_run "$GITHUB_RUN_ID" \
             '. + {verification: {expected_apk_sha256: $expected, certificate_sha256: $certificate, workflow_run: $workflow_run, status: "published_as_prerelease_and_verified"}}' \
             /tmp/alpha32-release.json > .release-status/v0.13.0-alpha32.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .release-status/v0.13.0-alpha32.json
          git commit -m "release: record verified v0.13.0-alpha32 prerelease" || true
          git push origin HEAD:"$GITHUB_REF_NAME"
