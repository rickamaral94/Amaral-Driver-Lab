name: Publish v0.13.0-alpha18 prerelease

on:
  push:
    branches:
      - agent/alpha18-runner-hardening
    paths:
      - '.github/workflows/publish-alpha18-prerelease.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
      TAG: v0.13.0-alpha18
      APK_NAME: Amaral-Driver-Lab-v0.13.0-alpha18.apk
      SHA_NAME: Amaral-Driver-Lab-v0.13.0-alpha18.sha256
    steps:
      - name: Checkout prerelease source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Native toolchain
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest :telemetry-sdk:testDebugUnitTest --stacktrace --console=plain

      - name: Build prerelease APK
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain

      - name: Prepare and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" \
            | grep -F "versionName='0.13.0-alpha18'"
          mkdir -p release
          cp "$apk" "release/${APK_NAME}"
          (
            cd release
            sha256sum "${APK_NAME}" > "${SHA_NAME}"
          )

      - name: Publish GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          NOTES=$(cat <<'EOF'
          ## Amaral Driver Lab v0.13.0-alpha18

          This prerelease hardens the visual Vulkan runner after the alpha17 logs isolated a native null-dispatch crash in vkCreateAndroidSurfaceKHR on the Odin 2 Portal / Adreno 740.

          ### Runner and task isolation
          - runs native activities in a disposable Android task separate from the main Driver Lab interface;
          - prevents a native runner crash from removing the main application task and returning directly to the launcher;
          - cancels stale coordinators when the host Activity is destroyed.

          ### Vulkan WSI initialization
          - enumerates and selects the physical device before Android surface creation;
          - validates VK_KHR_swapchain before acquiring the Android native window;
          - records durable before/after stages for physical-device, extension and surface operations.

          ### Safe qualification abort
          - stops the Full Qualification after the first calibration runner failure;
          - preserves suite.json, the failed step and the native stage instead of launching the next visual scene;
          - keeps app logs exportable from the home screen.

          ### Installation warning
          Alpha17 and alpha18 CI APKs use different Android debug certificates. Export any logs you want to preserve, uninstall alpha17, then install alpha18. Future releases should move to a stable signing key.

          ### Validation
          - application and telemetry unit tests run before publication;
          - Java API 28-35 and arm64 JNI/C++ compile before publication;
          - aapt verifies versionName 0.13.0-alpha18;
          - the uploaded APK digest is verified against the generated SHA-256.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Amaral Driver Lab v0.13.0-alpha18" \
              --notes "$NOTES" --draft=false --prerelease
          else
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Amaral Driver Lab v0.13.0-alpha18" \
              --notes "$NOTES" --prerelease
          fi
          gh release upload "$TAG" \
            "release/${APK_NAME}" "release/${SHA_NAME}" --clobber

      - name: Verify prerelease and record status
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" \
            --json tagName,name,url,targetCommitish,publishedAt,isDraft,isPrerelease,assets \
            > /tmp/alpha18-release.json
          test "$(jq -r '.isDraft' /tmp/alpha18-release.json)" = "false"
          test "$(jq -r '.isPrerelease' /tmp/alpha18-release.json)" = "true"
          apk_sha=$(awk '{print $1}' "release/${SHA_NAME}")
          remote_digest=$(jq -r --arg name "$APK_NAME" \
            '.assets[] | select(.name == $name) | .digest' /tmp/alpha18-release.json)
          test "$remote_digest" = "sha256:${apk_sha}"

          git checkout "$GITHUB_REF_NAME"
          git pull --ff-only origin "$GITHUB_REF_NAME"
          mkdir -p .release-status
          jq --arg expected "$apk_sha" \
             --arg workflow_run "$GITHUB_RUN_ID" \
             '. + {verification: {expected_apk_sha256: $expected, workflow_run: $workflow_run, status: "published_as_prerelease_and_verified"}}' \
             /tmp/alpha18-release.json > .release-status/v0.13.0-alpha18.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .release-status/v0.13.0-alpha18.json
          git commit -m "release: record verified v0.13.0-alpha18 prerelease" || true
          git push origin HEAD:"$GITHUB_REF_NAME"
