name: Materialize alpha10 unrestricted log picker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-alpha10-log-picker.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent/alpha10-unrestricted-log-picker
          fetch-depth: 0

      - name: Remove Android MIME whitelist and bump alpha10
        shell: python
        run: |
          from pathlib import Path

          main = Path('app/src/main/java/com/amaral/driverlab/MainActivity.java')
          text = main.read_text(encoding='utf-8')
          old = '''        picker.setType("*/*");
          picker.putExtra(Intent.EXTRA_MIME_TYPES, new String[]{
                  "text/plain", "text/x-log", "application/log",
                  "application/octet-stream"
          });
          startActivityForResult(picker, REQUEST_IMPORT_EMULATOR_LOG);'''
          new = '''        // Do not apply an Android MIME whitelist here. Several file managers classify
          // .log files as unknown/proprietary MIME types and disable them before the app
          // can validate the extension. The app validates .txt/.log after selection.
          picker.setType("*/*");
          startActivityForResult(picker, REQUEST_IMPORT_EMULATOR_LOG);'''
          if old not in text:
              raise SystemExit('Expected emulator picker block not found')
          main.write_text(text.replace(old, new, 1), encoding='utf-8')

          gradle = Path('app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          g = g.replace('versionCode 22', 'versionCode 23', 1)
          g = g.replace("versionName '0.13.0-alpha9'", "versionName '0.13.0-alpha10'", 1)
          gradle.write_text(g, encoding='utf-8')

          docs = Path('docs/ALPHA10_UNRESTRICTED_LOG_PICKER.md')
          docs.write_text('''# Alpha10: unrestricted Android log picker\n\nThe Android document picker now opens with `*/*` and without `Intent.EXTRA_MIME_TYPES`.\n\nThis is intentional: some Android file managers report `.log` files with unknown or vendor-specific MIME types and disable them when a MIME whitelist is supplied. The application still validates the selected display name locally and accepts only `.txt` and `.log`, case-insensitively.\n''', encoding='utf-8')

      - name: Commit alpha10 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle app/src/main/java/com/amaral/driverlab/MainActivity.java docs/ALPHA10_UNRESTRICTED_LOG_PICKER.md
          git commit -m "fix: allow Android picker to select unknown MIME log files"
          git push origin HEAD:agent/alpha10-unrestricted-log-picker
