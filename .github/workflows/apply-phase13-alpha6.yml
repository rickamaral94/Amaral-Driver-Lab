name: Apply Phase 13 alpha6

on:
  push:
    branches:
      - agent/phase13-ux-redesign
    paths:
      - '.phase13-alpha6/**'
      - '.github/workflows/apply-phase13-alpha6.yml'

permissions:
  contents: write

jobs:
  apply-alpha6:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase13-ux-redesign
          fetch-depth: 0

      - name: Verify, apply and publish alpha6
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/alpha6.patch
          for part in .phase13-alpha6/part-*.b64; do
            base64 --decode "$part" >> /tmp/alpha6.patch
          done
          echo '51b6ffb6cde30ed8992f4562e54c01e93a7cdfc0aab683ec243d442584796d93  /tmp/alpha6.patch' | sha256sum --check
          git apply --check /tmp/alpha6.patch
          git apply /tmp/alpha6.patch
          rm -rf .phase13-alpha6
          rm -f .github/workflows/apply-phase13-alpha6.yml
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle \
            app/src/main/java/com/amaral/driverlab/GitHubIssuePublisher.java \
            app/src/main/java/com/amaral/driverlab/QualificationOptimizationReport.java \
            app/src/test/java/com/amaral/driverlab/QualificationOptimizationReportTest.java \
            .phase13-alpha6 \
            .github/workflows/apply-phase13-alpha6.yml
          git commit -m 'Phase 13 alpha6 comparative issue report'
          git push origin HEAD:agent/phase13-ux-redesign
