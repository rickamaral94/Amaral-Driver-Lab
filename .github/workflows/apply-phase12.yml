name: Apply Phase 12 implementation

on:
  push:
    branches:
      - agent/phase12-complete-localization
    paths:
      - '.phase12-b64.*'
      - '.github/workflows/apply-phase12.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply localized implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .phase12-b64.00 .phase12-b64.01 .phase12-b64.02 .phase12-b64.03 \
              .phase12-b64.04 .phase12-b64.05 .phase12-b64.06 .phase12-b64.07 \
              .phase12-b64.08 .phase12-b64.09 .phase12-b64.10 .phase12-b64.11 \
              .phase12-b64.12 .phase12-b64.13 .phase12-b64.14 .phase12-b64.15 \
              > /tmp/phase12.patch.gz.b64
          base64 --decode /tmp/phase12.patch.gz.b64 > /tmp/phase12.patch.gz
          gunzip -c /tmp/phase12.patch.gz > /tmp/phase12.patch
          git apply --check /tmp/phase12.patch
          git apply /tmp/phase12.patch
          rm -f .phase12-b64.*
          rm -f .github/workflows/apply-phase12.yml
          rm -f .github/workflows/phase12-source-snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add complete application localization"
          git push origin HEAD:agent/phase12-complete-localization
