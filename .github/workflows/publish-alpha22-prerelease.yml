name: Publish v0.13.0-alpha22 prerelease

on:
  push:
    branches:
      - agent/alpha21-ranking-v5
    paths:
      - '.github/workflows/publish-alpha22-prerelease.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
      TAG: v0.13.0-alpha22
      APK_NAME: Amaral-Driver-Lab-v0.13.0-alpha22.apk
      SHA_NAME: Amaral-Driver-Lab-v0.13.0-alpha22.sha256
    steps:
      - name: Checkout prerelease source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Native toolchain
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest :telemetry-sdk:testDebugUnitTest --stacktrace --console=plain

      - name: Build prerelease APK
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain

      - name: Prepare and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" \
            | grep -F "versionName='0.13.0-alpha22'"
          mkdir -p release
          cp "$apk" "release/${APK_NAME}"
          (
            cd release
            sha256sum "${APK_NAME}" > "${SHA_NAME}"
          )

      - name: Publish GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          NOTES=$(cat <<'EOF'
          ## Amaral Driver Lab v0.13.0-alpha22

          Esta versão corrige a etapa final da qualificação identificada pelos logs da alpha21. Todos os workloads terminavam, mas uma exceção posterior no relatório, HTML ou bundle podia deixar o manifesto como `running` e devolver o usuário à tela inicial sem conclusão.

          ### Finalização resiliente
          - persiste o estado concluído antes de gerar artefatos opcionais;
          - uma falha no HTML, leaderboard ou ZIP não descarta mais o benchmark executado;
          - gera relatório mínimo de contingência se a consolidação analítica completa falhar;
          - mantém os `suite.json` e medições brutas disponíveis para diagnóstico e ranking;
          - registra `qualification_finalization_warning` com o estágio e a exceção exatos;
          - inclui o `qualification.json` concluído dentro do bundle diagnóstico;
          - permite retomar uma qualificação alpha21 que terminou os workloads mas ficou marcada como `running`.

          ### Mantido da alpha21
          - correção do fluxo Vulkan que concluiu as 209 execuções observadas no Odin 2 Portal;
          - Ranking Turnip v5, teste nulo, histórico append-only e modo sem injeção;
          - encerramento isolado do processo `:runner` após cada resultado.

          ### Validação
          - testes unitários do app e telemetry SDK aprovados;
          - Java API 28-35 e JNI/C++ arm64 compilados;
          - `aapt` confirma versionName 0.13.0-alpha22;
          - o SHA-256 do APK publicado é verificado após o upload.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Amaral Driver Lab v0.13.0-alpha22" \
              --notes "$NOTES" --draft=false --prerelease
          else
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Amaral Driver Lab v0.13.0-alpha22" \
              --notes "$NOTES" --prerelease
          fi
          gh release upload "$TAG" \
            "release/${APK_NAME}" "release/${SHA_NAME}" --clobber

      - name: Verify prerelease and record status
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" \
            --json tagName,name,url,targetCommitish,publishedAt,isDraft,isPrerelease,assets \
            > /tmp/alpha22-release.json
          test "$(jq -r '.isDraft' /tmp/alpha22-release.json)" = "false"
          test "$(jq -r '.isPrerelease' /tmp/alpha22-release.json)" = "true"
          apk_sha=$(awk '{print $1}' "release/${SHA_NAME}")
          remote_digest=$(jq -r --arg name "$APK_NAME" \
            '.assets[] | select(.name == $name) | .digest' /tmp/alpha22-release.json)
          test "$remote_digest" = "sha256:${apk_sha}"

          git checkout "$GITHUB_REF_NAME"
          git pull --ff-only origin "$GITHUB_REF_NAME"
          mkdir -p .release-status
          jq --arg expected "$apk_sha" \
             --arg workflow_run "$GITHUB_RUN_ID" \
             '. + {verification: {expected_apk_sha256: $expected, workflow_run: $workflow_run, status: "published_as_prerelease_and_verified"}}' \
             /tmp/alpha22-release.json > .release-status/v0.13.0-alpha22.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .release-status/v0.13.0-alpha22.json
          git commit -m "release: record verified v0.13.0-alpha22 prerelease" || true
          git push origin HEAD:"$GITHUB_REF_NAME"
