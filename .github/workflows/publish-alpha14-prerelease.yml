name: Publish v0.13.0-alpha14 prerelease

on:
  push:
    branches:
      - agent/phase2-dynamic-range-v2-pr
    paths:
      - '.github/workflows/publish-alpha14-prerelease.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
      TAG: v0.13.0-alpha14
      APK_NAME: Amaral-Driver-Lab-v0.13.0-alpha14.apk
      SHA_NAME: Amaral-Driver-Lab-v0.13.0-alpha14.sha256
    steps:
      - name: Checkout prerelease source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Native toolchain
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest :telemetry-sdk:testDebugUnitTest --stacktrace --console=plain

      - name: Build prerelease APK
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain

      - name: Prepare and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" \
            | grep -F "versionName='0.13.0-alpha14'"
          mkdir -p release
          cp "$apk" "release/${APK_NAME}"
          (
            cd release
            sha256sum "${APK_NAME}" > "${SHA_NAME}"
          )

      - name: Publish GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          NOTES=$(cat <<'EOF'
          ## Amaral Driver Lab v0.13.0-alpha14

          This prerelease fixes the isolated-runner lifecycle regression found while starting a Turnip-versus-Turnip Full Recommended v6 qualification.

          ### Runner lifecycle
          - isolated runners now call `finish()` and never remove the application's parent task;
          - the qualification screen remains available while the `:runner` process exits and is recreated for the next arm;
          - regression tests prevent `finishAndRemoveTask()` from returning to any runner.

          ### Crash and timeout evidence
          - durable breadcrumbs are written before JNI loading and before entering the native Vulkan workload;
          - synthetic crash/timeout results preserve the last runner stage, workload, driver role, display name, and SHA-256;
          - calibration-probe failures now produce a failed suite and enter the diagnostic bundle instead of disappearing as an unstructured step error;
          - deep diagnostics now detects an unexpected runner exit before the timeout ceiling.

          ### Evidence limits
          The app records that an isolated native process exited, but it does not invent the signal. Exact attribution to `SIGSEGV`, `SIGABRT`, or another native signal still requires an Android tombstone or external ADB logcat.

          ### Validation status
          - Android and telemetry unit tests execute before publication;
          - native C++ and the arm64 debug APK build before publication;
          - the APK manifest is checked for version `0.13.0-alpha14`;
          - the uploaded APK digest is verified against the generated SHA-256.

          This is a test prerelease, not a stable release. The Phase 2 physical protocol remains pending on the Odin 2 Portal / Adreno A740, beginning with Turnip Amaral v1 versus v3.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Amaral Driver Lab v0.13.0-alpha14" \
              --notes "$NOTES" --draft=false --prerelease
          else
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Amaral Driver Lab v0.13.0-alpha14" \
              --notes "$NOTES" --prerelease
          fi
          gh release upload "$TAG" \
            "release/${APK_NAME}" "release/${SHA_NAME}" --clobber

      - name: Verify prerelease and record status
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" \
            --json tagName,name,url,targetCommitish,publishedAt,isDraft,isPrerelease,assets \
            > /tmp/alpha14-release.json
          test "$(jq -r '.isDraft' /tmp/alpha14-release.json)" = "false"
          test "$(jq -r '.isPrerelease' /tmp/alpha14-release.json)" = "true"
          apk_sha=$(awk '{print $1}' "release/${SHA_NAME}")
          remote_digest=$(jq -r --arg name "$APK_NAME" \
            '.assets[] | select(.name == $name) | .digest' /tmp/alpha14-release.json)
          test "$remote_digest" = "sha256:${apk_sha}"

          git checkout "$GITHUB_REF_NAME"
          git pull --ff-only origin "$GITHUB_REF_NAME"
          mkdir -p .release-status
          jq --arg expected "$apk_sha" \
             --arg workflow_run "$GITHUB_RUN_ID" \
             '. + {verification: {expected_apk_sha256: $expected, workflow_run: $workflow_run, status: "published_as_prerelease_and_verified"}}' \
             /tmp/alpha14-release.json > .release-status/v0.13.0-alpha14.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .release-status/v0.13.0-alpha14.json
          git commit -m "release: record verified v0.13.0-alpha14 prerelease" || true
          git push origin HEAD:"$GITHUB_REF_NAME"
