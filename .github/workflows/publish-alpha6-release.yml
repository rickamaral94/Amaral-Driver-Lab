name: Publish v0.13.0-alpha6 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-alpha6-release.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.13.0-alpha6
      TARGET_SHA: e732e716afd05b07901bef65668b995d936c4def
      ARTIFACT_ID: '8923514830'
      EXPECTED_APK_SHA256: a6d4c3b109308631a9247b294786ccc8c7a4bcd936d941bd18947a5dfca49dc9
      APK_NAME: Amaral-Driver-Lab-v0.13.0-alpha6.apk
      SHA_NAME: Amaral-Driver-Lab-v0.13.0-alpha6.sha256
      STATUS_PATH: .release-status/v0.13.0-alpha6.json
    steps:
      - name: Download validated APK artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output /tmp/amaral-alpha6-artifact.zip
          mkdir -p /tmp/amaral-alpha6
          unzip -q /tmp/amaral-alpha6-artifact.zip -d /tmp/amaral-alpha6
          APK_SOURCE="$(find /tmp/amaral-alpha6 -type f -name '*.apk' -print -quit)"
          test -n "$APK_SOURCE"
          cp "$APK_SOURCE" "/tmp/$APK_NAME"
          echo "$EXPECTED_APK_SHA256  /tmp/$APK_NAME" | sha256sum --check
          printf '%s  %s\n' "$EXPECTED_APK_SHA256" "$APK_NAME" > "/tmp/$SHA_NAME"

      - name: Create or update GitHub release
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          ## Amaral Driver Lab v0.13.0-alpha6

          Primeira publicação consolidada das Fases 1–13 do Amaral Driver Lab.

          ### Destaques

          - fluxo principal simplificado para comparação **Sistema × Turnip** e **Turnip × Turnip**;
          - identificação explícita de **DRIVER CANDIDATO** e **DRIVER DE REFERÊNCIA**;
          - placar geral por etapas e por rodadas;
          - medianas, médias, P95, P99, coeficiente de variação e amostras;
          - diferenças absolutas, deltas normalizados, razões e intervalo de confiança de 95%;
          - comparação visual, auditoria dos loaders, hardware, SoC e GPU;
          - relatório de issue do GitHub voltado à otimização dos drivers Amaral Turnip;
          - localização completa do aplicativo;
          - Full Qualification v3, diagnósticos profundos, cenas Vulkan, traces e telemetria opcional.

          ### Validação automatizada

          - 98 testes JVM aprovados;
          - 0 falhas e 0 testes ignorados;
          - Android SDK 35;
          - NDK 27.2.12479018 e CMake 3.22.1;
          - compilação Vulkan nativa arm64 aprovada;
          - APK debug gerada pelo workflow `30989506232`.

          ### Integridade

          SHA-256 da APK:

          `a6d4c3b109308631a9247b294786ccc8c7a4bcd936d941bd18947a5dfca49dc9`

          Esta é uma versão **alpha**. A validação automatizada foi concluída; testes físicos adicionais no Odin 2 Portal continuam recomendados.
          EOF
          sed -i 's/^          //' /tmp/release-notes.md

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --target "$TARGET_SHA" \
              --title "Amaral Driver Lab v0.13.0-alpha6" \
              --notes-file /tmp/release-notes.md \
              --prerelease
            gh release upload "$TAG" \
              "/tmp/$APK_NAME" "/tmp/$SHA_NAME" \
              --repo "${{ github.repository }}" \
              --clobber
          else
            gh release create "$TAG" \
              "/tmp/$APK_NAME" "/tmp/$SHA_NAME" \
              --repo "${{ github.repository }}" \
              --target "$TARGET_SHA" \
              --title "Amaral Driver Lab v0.13.0-alpha6" \
              --notes-file /tmp/release-notes.md \
              --prerelease
          fi

      - name: Record verified publication
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_JSON="$(gh release view "$TAG" --repo "${{ github.repository }}" --json url,tagName,isPrerelease,publishedAt,assets,targetCommitish)"
          printf '%s' "$RELEASE_JSON" | jq \
            --arg expected_sha256 "$EXPECTED_APK_SHA256" \
            --arg apk_name "$APK_NAME" \
            --arg sha_name "$SHA_NAME" \
            --arg workflow_run "${{ github.run_id }}" \
            '. + {
              verification: {
                apk_name: $apk_name,
                sha256_file: $sha_name,
                expected_apk_sha256: $expected_sha256,
                workflow_run: $workflow_run,
                status: "published_and_verified"
              }
            }' > /tmp/release-status.json

          CONTENT="$(base64 -w0 /tmp/release-status.json)"
          EXISTING_SHA="$(gh api "repos/${{ github.repository }}/contents/$STATUS_PATH?ref=main" --jq .sha 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "repos/${{ github.repository }}/contents/$STATUS_PATH" \
              -f message='chore: record v0.13.0-alpha6 release publication' \
              -f branch='main' \
              -f content="$CONTENT" \
              -f sha="$EXISTING_SHA" >/dev/null
          else
            gh api --method PUT "repos/${{ github.repository }}/contents/$STATUS_PATH" \
              -f message='chore: record v0.13.0-alpha6 release publication' \
              -f branch='main' \
              -f content="$CONTENT" >/dev/null
          fi
