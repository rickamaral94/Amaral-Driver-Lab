name: Publish v0.13.0-alpha24 prerelease

on:
  push:
    branches: [agent/alpha21-ranking-v5]
    paths: ['.github/workflows/publish-alpha24-prerelease.yml']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
      TAG: v0.13.0-alpha24
      APK_NAME: Amaral-Driver-Lab-v0.13.0-alpha24.apk
      SHA_NAME: Amaral-Driver-Lab-v0.13.0-alpha24.sha256
      CERT_SHA256: 4bb6b5cb69f6b46b50e5870ea7830db5465617fca7a593cfbb5bc4f0885b8173
    steps:
      - name: Checkout prerelease source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Native toolchain
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest :telemetry-sdk:testDebugUnitTest --stacktrace --console=plain

      - name: Build prerelease APK
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain

      - name: Prepare and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" \
            | grep -F "versionName='0.13.0-alpha24'"
          actual_cert=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --print-certs "$apk" | awk -F': ' '/certificate SHA-256 digest/ {print $2; exit}')
          test "$actual_cert" = "$CERT_SHA256"
          mkdir -p release
          cp "$apk" "release/${APK_NAME}"
          (cd release && sha256sum "${APK_NAME}" > "${SHA_NAME}")

      - name: Publish GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          NOTES=$(cat <<'EOF'
          ## Amaral Driver Lab v0.13.0-alpha24

          Versão indicada para testar o ranking na página inicial. Ela mantém as correções da alpha23 e inicia uma assinatura estável para as próximas versões alpha.

          ### Ranking na tela inicial
          - tabela de até 10 drivers no fim da página principal;
          - estado bloqueado e motivo exibidos no mesmo local;
          - botão de teste nulo integrado;
          - sessão livre v6 × v8 preservada no histórico, sem fabricar Score;
          - detalhes, referências, desclassificados e inelegíveis continuam acessíveis sob demanda.

          ### Confiabilidade
          - bundle diagnóstico processado em streaming, sem alocar o ZIP inteiro no heap;
          - assinatura alpha fixa verificada no pipeline para permitir atualizações futuras sem perda de dados;
          - testes Java, build JNI/C++ arm64, versionName, certificado e SHA-256 verificados antes da publicação.

          ### Migração da alpha22/alpha23
          As versões anteriores foram assinadas por executores temporários. Antes de desinstalá-las, exporte o histórico na tela antiga de Ranking. Depois instale a alpha24 e importe o JSON. Da alpha24 em diante, a assinatura permanece estável.
          EOF
          )
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "Amaral Driver Lab v0.13.0-alpha24" \
            --notes "$NOTES" --prerelease
          gh release upload "$TAG" \
            "release/${APK_NAME}" "release/${SHA_NAME}" --clobber

      - name: Verify prerelease and record status
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" \
            --json tagName,name,url,targetCommitish,publishedAt,isDraft,isPrerelease,assets \
            > /tmp/alpha24-release.json
          test "$(jq -r '.isDraft' /tmp/alpha24-release.json)" = "false"
          test "$(jq -r '.isPrerelease' /tmp/alpha24-release.json)" = "true"
          apk_sha=$(awk '{print $1}' "release/${SHA_NAME}")
          remote_digest=$(jq -r --arg name "$APK_NAME" \
            '.assets[] | select(.name == $name) | .digest' /tmp/alpha24-release.json)
          test "$remote_digest" = "sha256:${apk_sha}"

          git checkout "$GITHUB_REF_NAME"
          git pull --ff-only origin "$GITHUB_REF_NAME"
          mkdir -p .release-status
          jq --arg expected "$apk_sha" --arg certificate "$CERT_SHA256" \
             --arg workflow_run "$GITHUB_RUN_ID" \
             '. + {verification: {expected_apk_sha256: $expected, certificate_sha256: $certificate, workflow_run: $workflow_run, status: "published_as_prerelease_and_verified"}}' \
             /tmp/alpha24-release.json > .release-status/v0.13.0-alpha24.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .release-status/v0.13.0-alpha24.json
          git commit -m "release: record verified v0.13.0-alpha24 prerelease" || true
          git push origin HEAD:"$GITHUB_REF_NAME"
