name: Publish v0.13.0-alpha28 prerelease

on:
  push:
    branches: [agent/alpha21-ranking-v5]
    paths: ['.github/workflows/publish-alpha28-prerelease.yml']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
      TAG: v0.13.0-alpha28
      APK_NAME: Amaral-Driver-Lab-v0.13.0-alpha28.apk
      SHA_NAME: Amaral-Driver-Lab-v0.13.0-alpha28.sha256
      CERT_SHA256: 4bb6b5cb69f6b46b50e5870ea7830db5465617fca7a593cfbb5bc4f0885b8173
    steps:
      - name: Checkout prerelease source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Native toolchain
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest :telemetry-sdk:testDebugUnitTest --stacktrace --console=plain

      - name: Build prerelease APK
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain

      - name: Prepare and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" \
            | grep -F "versionName='0.13.0-alpha28'"
          actual_cert=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --print-certs "$apk" | awk -F': ' '/certificate SHA-256 digest/ {print $2; exit}')
          test "$actual_cert" = "$CERT_SHA256"
          mkdir -p release
          cp "$apk" "release/${APK_NAME}"
          (cd release && sha256sum "${APK_NAME}" > "${SHA_NAME}")

      - name: Publish GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          NOTES=$(cat <<'EOF'
          ## Amaral Driver Lab v0.13.0-alpha28

          Perfil de medição v7. A carga de performance passa a ter a forma do que um emulador realmente produz.

          ### O problema
          Todo A/B rodado no perfil v6 voltou **empate técnico** em torno de 0,1%. Não era azar: as etapas de performance dele renderizam uma cena grande e uniforme, com coeficiente de variação perto de **0,03%**. Era um instrumento precisíssimo apontado para algo que não varia entre drivers.

          ### `emulator_frame_pattern`
          Emite muitos render passes pequenos, poucos draws cada, alvos de 256 a 960 px — e varre **store contra discard**.

          O store é o que força a memória de tile a voltar para a memória de sistema. É esse tráfego que faz GMEM e sysmem deixarem de ser equivalentes. Reporta `store_penalty_ratio`: quanto o driver paga para preservar um alvo em vez de descartá-lo.

          Sem uma carga assim, opções como `tu_autotune_algorithm` são inavaliáveis por falta de mecanismo acionado — não por falta de A/B.

          ### Pesos
          | Etapa | Peso |
          |---|---:|
          | `emulator_frame` | **70** |
          | `shader_compile` | **30** |
          | gates | 0 |

          O `shader_compile` fica porque é o único eixo que já mostrou separação grande (44,7% entre Turnip e blob). O `stable_scene` sai.

          ### Os gates continuam
          Correção offscreen, as quatro cenas visíveis e o trace replay permanecem, com peso zero. Eles não são fracos — foram eles que pegaram o driver v8b falhando 92 de 92 rodadas de apresentação. Trocá-los por espaço seria abrir mão da única parte da suíte que funcionava.

          O perfil v6 continua legível: corridas antigas seguem abrindo normalmente.

          ### Comparabilidade
          Resultados do v7 **não** se comparam com os do v6 — carga diferente, número diferente. As séries históricas ficam separadas, como manda o contrato.

          ### Instalação
          Mesma assinatura desde a alpha24. Instala por cima sem perder histórico.
          EOF
          )
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "Amaral Driver Lab v0.13.0-alpha28" \
            --notes "$NOTES" --prerelease
          gh release upload "$TAG" \
            "release/${APK_NAME}" "release/${SHA_NAME}" --clobber

      - name: Verify prerelease and record status
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" \
            --json tagName,name,url,targetCommitish,publishedAt,isDraft,isPrerelease,assets \
            > /tmp/alpha28-release.json
          test "$(jq -r '.isDraft' /tmp/alpha28-release.json)" = "false"
          test "$(jq -r '.isPrerelease' /tmp/alpha28-release.json)" = "true"
          apk_sha=$(awk '{print $1}' "release/${SHA_NAME}")
          remote_digest=$(jq -r --arg name "$APK_NAME" \
            '.assets[] | select(.name == $name) | .digest' /tmp/alpha28-release.json)
          test "$remote_digest" = "sha256:${apk_sha}"

          git checkout "$GITHUB_REF_NAME"
          git pull --ff-only origin "$GITHUB_REF_NAME"
          mkdir -p .release-status
          jq --arg expected "$apk_sha" --arg certificate "$CERT_SHA256" \
             --arg workflow_run "$GITHUB_RUN_ID" \
             '. + {verification: {expected_apk_sha256: $expected, certificate_sha256: $certificate, workflow_run: $workflow_run, status: "published_as_prerelease_and_verified"}}' \
             /tmp/alpha28-release.json > .release-status/v0.13.0-alpha28.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .release-status/v0.13.0-alpha28.json
          git commit -m "release: record verified v0.13.0-alpha28 prerelease" || true
          git push origin HEAD:"$GITHUB_REF_NAME"
