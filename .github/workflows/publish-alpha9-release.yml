name: Publish v0.13.0-alpha9 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-alpha9-release.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.13.0-alpha9
      TARGET_SHA: 75e570219d2015739635a0514f92e0f55b113a8e
      SOURCE_RUN: '31040981978'
      SOURCE_ARTIFACT: '8944574749'
      APK_NAME: Amaral-Driver-Lab-v0.13.0-alpha9.apk
      SHA_NAME: Amaral-Driver-Lab-v0.13.0-alpha9.sha256
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download validated APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/alpha9-artifact release
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT}/zip" > /tmp/alpha9-artifact.zip
          unzip -q /tmp/alpha9-artifact.zip -d /tmp/alpha9-artifact
          test -f /tmp/alpha9-artifact/app-debug.apk
          cp /tmp/alpha9-artifact/app-debug.apk "release/${APK_NAME}"
          sha256sum "release/${APK_NAME}" > "release/${SHA_NAME}"

      - name: Publish full release
        shell: bash
        run: |
          set -euo pipefail
          NOTES=$(cat <<'EOF'
          ## Amaral Driver Lab v0.13.0-alpha9

          This release makes the emulator-log workflow explicitly accept `.txt` and `.log` files.

          ### Changes
          - home-screen button and guidance now show `.TXT / .LOG`;
          - file names are validated case-insensitively before reading;
          - unsupported extensions receive a localized error;
          - Android document-provider compatibility is preserved for plain-text, log and generic stream MIME types;
          - unit tests cover lowercase and uppercase `.txt`/`.log` files and rejected formats.

          ### Validation
          - Android CI run: `31040981978`;
          - 107 tests, 0 failures, 0 ignored;
          - Android SDK, NDK, CMake and native Vulkan build passed;
          - APK generation and artifact upload passed.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Amaral Driver Lab v0.13.0-alpha9" --notes "$NOTES" --draft=false --prerelease=false --latest
          else
            gh release create "$TAG" --target "$TARGET_SHA" --title "Amaral Driver Lab v0.13.0-alpha9" --notes "$NOTES" --latest
          fi
          gh release upload "$TAG" "release/${APK_NAME}" "release/${SHA_NAME}" --clobber

      - name: Verify release and record status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release-status
          gh release view "$TAG" --json tagName,name,url,targetCommitish,publishedAt,isDraft,isPrerelease,assets > /tmp/alpha9-release.json
          apk_sha=$(awk '{print $1}' "release/${SHA_NAME}")
          remote_digest=$(jq -r --arg name "$APK_NAME" '.assets[] | select(.name == $name) | .digest' /tmp/alpha9-release.json)
          test "$remote_digest" = "sha256:${apk_sha}"
          jq --arg expected "$apk_sha" \
             --arg workflow_run "$GITHUB_RUN_ID" \
             --arg source_run "$SOURCE_RUN" \
             --arg source_artifact "$SOURCE_ARTIFACT" \
             '. + {verification: {expected_apk_sha256: $expected, workflow_run: $workflow_run, source_android_workflow: $source_run, source_artifact: $source_artifact, tests: 107, failures: 0, ignored: 0, status: "published_as_full_release_and_verified"}}' \
             /tmp/alpha9-release.json > .release-status/v0.13.0-alpha9.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .release-status/v0.13.0-alpha9.json
          git commit -m "release: record verified v0.13.0-alpha9" || true
          git push origin HEAD:main
