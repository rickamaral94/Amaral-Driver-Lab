name: Phase 12 source snapshot

on:
  push:
    branches:
      - agent/phase12-complete-localization
  pull_request:
    branches:
      - agent/phase11-full-qualification-v3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source for local implementation
        uses: actions/upload-artifact@v4
        with:
          name: phase12-source-snapshot
          path: .
          include-hidden-files: true
          retention-days: 1
