plugins {
    id 'com.android.application'
}

def configuredClientId = providers.gradleProperty('GITHUB_CLIENT_ID')
        .orElse(providers.environmentVariable('GITHUB_CLIENT_ID'))
        .getOrElse('')
        .replace('\\', '\\\\')
        .replace('"', '\\"')

android {
    namespace 'com.amaral.driverlab'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.amaral.driverlab'
        minSdk 28
        targetSdk 35
        versionCode 13
        versionName '0.12.0-alpha1'

        buildConfigField 'String', 'GITHUB_CLIENT_ID', '"' + configuredClientId + '"'

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20 -Wall -Wextra -Werror=return-type'
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation project(':telemetry-sdk')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
